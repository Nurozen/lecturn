query LecturnExpoViewer {
  meActor {
    __typename
    ... on UserActor {
      username
    }
    ... on Robot {
      firstName
    }
    accounts {
      name
      appsPaginated(first: 100) {
        edges {
          node {
            id
            fullName
          }
        }
      }
    }
  }
}

query LecturnEasSimulatorAvailability($appId: String!, $filter: [String!]) {
  app {
    byId(appId: $appId) {
      ownerAccount {
        name
        accountFeatureGates(filter: $filter)
      }
    }
  }
}

mutation LecturnCreateEasSimulatorSession($input: CreateDeviceRunSessionInput!) {
  deviceRunSession {
    createDeviceRunSession(deviceRunSessionInput: $input) {
      id
    }
  }
}

query LecturnEasSimulatorSession($id: ID!) {
  deviceRunSessions {
    byId(deviceRunSessionId: $id) {
      id
      status
      remoteConfig {
        ... on AgentDeviceRunSessionRemoteConfig {
          agentDeviceRemoteSessionUrl
          agentDeviceRemoteSessionToken
          webPreviewToken
          previewApiUrl
        }
      }
    }
  }
}

query LecturnActiveEasSimulatorSessions($appId: String!, $filter: DeviceRunSessionFilterInput) {
  app {
    byId(appId: $appId) {
      deviceRunSessionsPaginated(first: 50, filter: $filter) {
        edges {
          node {
            id
            status
            name
          }
        }
      }
    }
  }
}

mutation LecturnStopEasSimulatorSession($id: ID!) {
  deviceRunSession {
    ensureDeviceRunSessionStopped(deviceRunSessionId: $id) {
      id
      status
    }
  }
}
