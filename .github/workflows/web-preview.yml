name: Web Preview

# Label a PR `preview:web` to get a hosted-web preview deployment on Vercel for
# that push and every subsequent push. Each PR gets its own controlled subdomain;
# the latest/nightly channel aliases are never touched.
#
# Builds inherit the Vercel project's Preview public Clerk/relay configuration.
# Production Clerk accounts require a preview on the same root domain. No Clerk
# secret or frontend API proxy is needed. These previews use real account data.
#
# Open the custom preview URL from the PR comment. Vite bakes that exact origin
# into the build; the generated vercel.app URL is not an authenticated preview.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy web preview
    # Same-repo PRs only: fork PRs do not receive the Vercel secrets, and this
    # workflow should skip rather than fail for them. On `labeled` events, only
    # the preview label itself triggers a deploy.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/scripts...
              - --filter=@lecturn/web...

      - id: deploy
        name: Deploy preview
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "Missing one or more required Vercel secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID." >&2
            exit 1
          fi

          vercel_scope="${VERCEL_TEAM_SLUG:-$VERCEL_ORG_ID}"
          preview_origin="https://pr-${PR_NUMBER}.preview.lecturn.cloudgatherer.net"

          deployment_url="$(
            vp dlx vercel@53.1.1 deploy \
              --archive=tgz \
              --build-env "VITE_HOSTED_APP_URL=$preview_origin" \
              --yes \
              --token "$VERCEL_TOKEN" \
              --scope "$vercel_scope"
          )"

          echo "Deployed $deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - id: alias
        name: Assign the PR preview domain
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: node scripts/assign-web-preview.ts

      - name: Comment deployment URL
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_URL: ${{ steps.alias.outputs.preview_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- web-preview-deploy -->";
            const body = [
              marker,
              "### Web preview",
              "",
              `${process.env.DEPLOYMENT_URL} (for ${process.env.HEAD_SHA.slice(0, 7)})`,
              "",
              "Open this exact URL — sign-in uses the existing production Lecturn account.",
              "This preview uses real account data. The generated vercel.app URL is not supported for sign-in.",
              "Pair a server into it with `lecturn pair --tailscale`, or paste a host + pairing",
              "code under Settings → Connections.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
