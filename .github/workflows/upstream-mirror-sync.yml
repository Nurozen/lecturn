# Fork-only workflow: keeps the `upstream-mirror` branch a pristine copy of
# the repository configured by the UPSTREAM_REPOSITORY Actions variable.
#
# This job does not touch `main`. It only force-updates the mirror, which
# gives the rest of the fork two things:
#   - a stable ref to diff and merge upstream from, without adding a remote
#   - a base to cut upstream-bound PR branches from, so they cannot carry
#     fork-only commits
#
# The local run-batches.py controller consumes this branch one reviewed
# checkpoint PR at a time. The Actions integration workflow is informational.
#
# Tags are never fetched: upstream `v*` tags would otherwise trigger this
# fork's release pipeline.
#
# Failure mode to know about: GitHub suspends scheduled workflows after 60
# days without repository activity. Any push re-arms it, and `workflow_dispatch`
# always works.
name: Upstream Mirror Sync

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: upstream-mirror-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPOSITORY }}
  UPSTREAM_BRANCH: main
  MIRROR_BRANCH: upstream-mirror

jobs:
  mirror:
    # Opt in explicitly, and never mirror the fork into itself.
    if: vars.UPSTREAM_REPOSITORY != '' && vars.UPSTREAM_REPOSITORY != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: false

      - name: Update mirror branch
        run: |
          set -euo pipefail
          if [[ ! "$UPSTREAM_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
             [[ "${UPSTREAM_REPO,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
            echo "UPSTREAM_REPOSITORY must identify a different owner/repository." >&2
            exit 1
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          if git ls-remote --exit-code --heads origin "${MIRROR_BRANCH}" >/dev/null 2>&1; then
            current="$(git ls-remote --heads origin "${MIRROR_BRANCH}" | cut -f1)"
            if [ "$current" = "$upstream_sha" ]; then
              echo "Mirror already at ${upstream_sha}."
              exit 0
            fi
          fi

          git push --force origin \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"
          echo "Mirror updated to ${upstream_sha}."
