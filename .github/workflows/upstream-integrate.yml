# Fork-only workflow: integrates upstream into this fork's `main` via a PR
# that Claude prepares.
#
# Runs after `t3mirror-sync.yml` refreshes the `t3mirror` branch. It performs a
# real `git merge` of `t3mirror` into an integration branch. A clean merge is
# pushed as-is. A conflicted merge is handed to Claude, which resolves the
# working tree in place using `.github/upstream-integration/RESOLUTION_GUIDE.md`
# and writes a summary the PR body quotes.
#
# Design notes worth keeping:
#   - It is always a real merge, so ancestry advances and the next run only
#     sees genuinely new upstream commits. Claude is never allowed to commit,
#     push, rebase or abort; the workflow owns those.
#   - Nothing lands on `main` automatically. CI gates the PR, a human merges.
#   - When an integration PR is already open, the newer mirror is merged into
#     that same branch rather than resetting it, so human fixes on the branch
#     survive and only the new upstream commits can conflict.
#   - The push uses the release GitHub App token when available. A branch
#     pushed with the default GITHUB_TOKEN does not trigger `pull_request`
#     workflows, which would leave the PR ungated.
name: Upstream Integrate

on:
  workflow_run:
    workflows: ["t3mirror Sync"]
    types: [completed]
  workflow_dispatch:
    inputs:
      model:
        description: Model for conflict resolution
        required: false
        default: claude-opus-5

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: upstream-integrate
  cancel-in-progress: false

env:
  MIRROR_BRANCH: t3mirror
  TARGET_BRANCH: main
  INTEGRATION_BRANCH: upstream-integration
  UPSTREAM_REPO: pingdotgg/t3code
  SUMMARY_FILE: .upstream-integration-summary.md
  # Cost dial. `claude-sonnet-5` is cheaper; conflict resolution here is
  # high-stakes enough that opus is the default.
  CLAUDE_MODEL: ${{ inputs.model || 'claude-opus-5' }}

jobs:
  integrate:
    # Guard against ever running in the upstream repository.
    if: >-
      github.repository != 'pingdotgg/t3code' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check for Claude credentials
        id: creds
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY set. Clean merges still open a PR; conflicts will fail the run."
          fi

      - name: Mint app token
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Without this the token covers every repo the app is installed on,
          # and the token is handed to the agent.
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          fetch-tags: false
          token: ${{ steps.app_token.outputs.token || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "upstream-integrate[bot]"
          git config user.email "upstream-integrate@users.noreply.github.com"

      - name: Find existing integration PR
        id: existing
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$INTEGRATION_BRANCH" --base "$TARGET_BRANCH" \
            --state open --json number --jq '.[0].number // empty')"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Prepare integration branch
        id: prepare
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${MIRROR_BRANCH}" "${TARGET_BRANCH}"
          mirror_sha="$(git rev-parse "origin/${MIRROR_BRANCH}")"
          echo "mirror_sha=${mirror_sha}" >> "$GITHUB_OUTPUT"
          echo "mirror_short=${mirror_sha:0:12}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$mirror_sha" "origin/${TARGET_BRANCH}"; then
            echo "${TARGET_BRANCH} already contains upstream ${mirror_sha}."
            echo "outcome=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ steps.existing.outputs.number }}" ] \
            && git ls-remote --exit-code --heads origin "${INTEGRATION_BRANCH}" >/dev/null 2>&1; then
            # Continue the open PR's branch so resolutions already made on it survive.
            git fetch --no-tags origin "${INTEGRATION_BRANCH}"
            git checkout -B "${INTEGRATION_BRANCH}" "origin/${INTEGRATION_BRANCH}"
            if ! git merge-base --is-ancestor "origin/${TARGET_BRANCH}" HEAD; then
              if ! git merge --no-edit "origin/${TARGET_BRANCH}" \
                -m "chore: merge ${TARGET_BRANCH} into ${INTEGRATION_BRANCH}"; then
                git merge --abort
                echo "::error::${TARGET_BRANCH} conflicts with the open ${INTEGRATION_BRANCH} branch. Merge ${TARGET_BRANCH} into the PR branch by hand, then re-run."
                exit 1
              fi
            fi
            base_ref="origin/${INTEGRATION_BRANCH}"
          else
            git checkout -B "${INTEGRATION_BRANCH}" "origin/${TARGET_BRANCH}"
            base_ref="origin/${TARGET_BRANCH}"
          fi

          count="$(git rev-list --count "HEAD..${mirror_sha}")"
          echo "commit_count=${count}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"
          echo "outcome=ready" >> "$GITHUB_OUTPUT"
          echo "Integrating ${count} upstream commits."

      - name: Require a token that can trigger PR checks
        if: steps.prepare.outputs.outcome == 'ready'
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY before integrating. GITHUB_TOKEN cannot trigger the required PR checks."
            exit 1
          fi

      - name: Attempt merge
        id: merge
        if: steps.prepare.outputs.outcome == 'ready'
        env:
          MIRROR_SHA: ${{ steps.prepare.outputs.mirror_sha }}
        run: |
          set -euo pipefail
          echo "pre_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if git merge --no-commit --no-ff "$MIRROR_SHA"; then
            echo "Merged cleanly."
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | sed 's/^/  conflict: /'
          fi

      - name: Fail early when conflicts need Claude but credentials are missing
        if: steps.merge.outputs.conflicted == 'true' && steps.creds.outputs.present == 'false'
        run: |
          echo "::error::Merge conflicted and no Claude credentials are configured. Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY, or resolve the merge by hand."
          exit 1

      - name: Resolve conflicts with Claude
        if: steps.merge.outputs.conflicted == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app_token.outputs.token || github.token }}
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 600
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(git add:*),Bash(git mv:*),Bash(git checkout --ours:*),Bash(git checkout --theirs:*),Bash(rg:*),Bash(ls:*),Bash(cat:*)"
            --disallowedTools "Bash(git commit:*),Bash(git push:*),Bash(git reset:*),Bash(git merge:*),Bash(git rebase:*),Bash(git cherry-pick:*),Bash(git config:*),Bash(node:*),Bash(pnpm:*),Bash(npm:*),Bash(curl:*),Bash(vp:*)"
          prompt: |
            Read `.github/upstream-integration/PROMPT.md` and follow it exactly.
            It is the whole task. A `git merge` is already in progress in this
            working tree and has left conflicts; discover the context from git
            as that file describes.

            Context for this run, for your summary: this is an unattended
            GitHub Actions run integrating
            ${{ steps.prepare.outputs.commit_count }} upstream commits at
            `${{ steps.prepare.outputs.mirror_short }}`. Dependencies are NOT
            installed here, so take the no-build path.

      - name: Verify the merge is intact
        id: verify
        if: steps.merge.outputs.conflicted == 'true'
        env:
          PRE_HEAD: ${{ steps.merge.outputs.pre_head }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
            echo "::error::MERGE_HEAD is gone. The agent committed or aborted the merge despite instructions. Nothing pushed."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$PRE_HEAD" ]; then
            echo "::error::HEAD moved during resolution. The agent committed despite instructions. Nothing pushed."
            exit 1
          fi

          unmerged="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unmerged" ]; then
            echo "::error::Files are still conflicted after resolution:"
            echo "$unmerged" | sed 's/^/  /'
            echo "Check the agent's summary in the run log, then resolve by hand:"
            echo "  git fetch origin ${MIRROR_BRANCH} && git merge origin/${MIRROR_BRANCH}"
            exit 1
          fi

          markers="$(git grep -lE '^(<{7}|>{7}) ' || true)"
          if [ -n "$markers" ]; then
            echo "::error::Conflict markers remain in tracked files:"
            echo "$markers" | sed 's/^/  /'
            exit 1
          fi

      - name: Commit the merge
        id: commit
        if: steps.prepare.outputs.outcome == 'ready'
        env:
          MIRROR_SHA: ${{ steps.prepare.outputs.mirror_sha }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
        run: |
          set -euo pipefail
          summary_body=""
          if [ -f "$SUMMARY_FILE" ]; then
            summary_body="$(cat "$SUMMARY_FILE")"
            rm -f "$SUMMARY_FILE"
          fi
          printf '%s' "$summary_body" > "${RUNNER_TEMP}/summary.md"

          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::warning::The agent created files not present on either side of the merge:"
            echo "$untracked" | sed 's/^/  /'
          fi
          printf '%s' "$untracked" > "${RUNNER_TEMP}/untracked.txt"

          git add -A
          if [ "$CONFLICTED" = "true" ]; then
            trailer="Conflicts resolved by Claude (${CLAUDE_MODEL}); review before merging."
          else
            trailer="Merged cleanly with no conflicts."
          fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1 || ! git diff --cached --quiet; then
            git commit --no-verify -m "chore: merge upstream ${UPSTREAM_REPO}@${MIRROR_SHA:0:12}" -m "$trailer"
          fi
          git push --force-with-lease origin "HEAD:${INTEGRATION_BRANCH}"

      - name: Open or update the PR
        id: pr
        if: steps.prepare.outputs.outcome == 'ready'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          MIRROR_SHA: ${{ steps.prepare.outputs.mirror_sha }}
          COMMIT_COUNT: ${{ steps.prepare.outputs.commit_count }}
          BASE_REF: ${{ steps.prepare.outputs.base_ref }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          {
            echo "Integrates ${COMMIT_COUNT} commits from [\`${UPSTREAM_REPO}\`](https://github.com/${UPSTREAM_REPO}) up to \`${MIRROR_SHA:0:12}\` into \`${TARGET_BRANCH}\`."
            echo
            if [ "$CONFLICTED" = "true" ]; then
              echo "The merge conflicted. Claude (\`${CLAUDE_MODEL}\`) resolved it against"
              echo "[\`RESOLUTION_GUIDE.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/${TARGET_BRANCH}/.github/upstream-integration/RESOLUTION_GUIDE.md)."
              echo "**Read the resolution summary below before merging.**"
            else
              echo "The merge was clean. No agent involved, no conflicts resolved."
            fi
            echo
            if [ -s "${RUNNER_TEMP}/summary.md" ]; then
              echo "## Resolution summary"
              echo
              cat "${RUNNER_TEMP}/summary.md"
              echo
            fi
            if [ -s "${RUNNER_TEMP}/untracked.txt" ]; then
              echo "## Files the agent created"
              echo
              echo "Not present on either side of the merge. Check these are intentional (a renumbered migration is; scratch files are not)."
              echo
              echo '```'
              cat "${RUNNER_TEMP}/untracked.txt"
              echo '```'
              echo
            fi
            echo "## Upstream commits"
            echo
            echo '```'
            git log --oneline --no-merges "${BASE_REF}..${MIRROR_SHA}" | head -100 || true
            echo '```'
            echo
            echo "<sub>Opened by \`upstream-integrate.yml\`. Do not force-push this branch by hand: the next run merges onto it.</sub>"
          } > "$body_file"

          existing="${{ steps.existing.outputs.number }}"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "chore: integrate upstream ${UPSTREAM_REPO}@${MIRROR_SHA:0:12}" \
              --body-file "$body_file"
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
            echo "url=$(gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_OUTPUT"
            echo "Updated PR #${existing}."
          else
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --head "$INTEGRATION_BRANCH" --base "$TARGET_BRANCH" \
              --title "chore: integrate upstream ${UPSTREAM_REPO}@${MIRROR_SHA:0:12}" \
              --body-file "$body_file")"
            gh pr edit "$url" --repo "$GITHUB_REPOSITORY" \
              --add-assignee "$GITHUB_REPOSITORY_OWNER" || \
              echo "::warning::Could not assign ${GITHUB_REPOSITORY_OWNER}; assign the PR by hand."
            echo "url=${url}" >> "$GITHUB_OUTPUT"
            echo "Opened ${url}."
          fi

      - name: Report
        if: always()
        run: |
          {
            if [ "${{ job.status }}" != "success" ]; then
              echo "### Integration did not complete"
              echo "See the failing step above; a ready branch does not mean a PR was published."
              exit 0
            fi
            case "${{ steps.prepare.outputs.outcome }}" in
              up-to-date)
                echo "### Already up to date"
                echo
                echo "\`${TARGET_BRANCH}\` contains upstream \`${{ steps.prepare.outputs.mirror_short }}\`. Nothing to integrate."
                ;;
              ready)
                echo "### Integration PR ready for review"
                echo
                echo "- ${{ steps.pr.outputs.url }}"
                echo "- ${{ steps.prepare.outputs.commit_count }} upstream commits"
                echo "- Conflicts: ${{ steps.merge.outputs.conflicted }}"
                ;;
              *)
                echo "### Integration did not complete"
                echo
                echo "See the failing step above."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
