# Fork-only informational entry point. Integration runs in a local Stave space
# with fresh agents and user-authenticated CLI credentials, not GITHUB_TOKEN.
name: Upstream Integrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-24.04
    steps:
      - name: Local sequential integration
        run: |
          echo 'The legacy whole-mirror resolver has been retired.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use .github/upstream-integration/run-batches.py and docs/operations/upstream-batches.md.' >> "$GITHUB_STEP_SUMMARY"
          echo 'One checkpoint PR at a time; fresh independent review and green CI precede each merge.' >> "$GITHUB_STEP_SUMMARY"
