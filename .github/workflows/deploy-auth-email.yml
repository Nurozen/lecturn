name: Deploy authentication email

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/auth-email/**
      - .github/workflows/deploy-auth-email.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: auth-email-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=lecturn-auth-email...
      - name: Verify handler
        run: |
          vp test run infra/auth-email/src/index.test.ts
          vp run --filter lecturn-auth-email typecheck
      - name: Deploy Worker and secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/auth-email
          packageManager: pnpm
          wranglerVersion: "4.82.2"
          command: deploy
          secrets: |
            CLERK_WEBHOOK_SIGNING_SECRET
            RESEND_API_KEY
        env:
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_EMAIL_WEBHOOK_SIGNING_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
