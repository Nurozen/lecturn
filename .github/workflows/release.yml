# Lecturn release workflow.
# Runs on GitHub-hosted runners only. Removed vs upstream: Blacksmith runners,
# AUR publishing, Vercel web
# deploy, Discord announcements, and the GitHub App release token (finalize
# uses github.token). Everything else is kept as close to upstream as possible
# to minimize nightly merge conflicts.
# Self-contained CLI archives (lecturn-<version>-<platform>.tar.gz/.zip plus
# SHA256SUMS) are built here and attached to the GitHub Release, which is what
# install.sh, `lecturn update`, SSH remotes, and the desktop WSL backend
# download. npm keeps receiving the single `lecturn` JS package: the upstream
# launcher-over-platform-packages layout (@lecturn/lecturn-<platform>) needs npm
# packages and trusted publishers the fork has not provisioned.
# Never push upstream `v*` tags to this repo: a tag push here cuts a release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  schedule:
    # Once daily, after the 09:23 UTC upstream sync. Off minute zero: GitHub
    # delays scheduled runs most at the top of the hour.
    - cron: "38 10 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Stable version override (for example 1.2.3). Defaults to the version the latest nightly previewed."
        required: false
        type: string
      stave_version:
        description: "Stave release tag to bundle (for example v0.4.0) or latest"
        required: false
        default: latest
        type: string

# Serialize nightlies (scheduled and manual) so overlapping runs cannot build
# the same commit twice or publish out of order. Stable tag releases get their
# own group so a nightly never blocks them. Running publishers are never
# canceled, and queue: max keeps every pending run instead of the default
# newest-wins single slot, so a queued stable tag can never be silently
# dropped. Automatic nightlies recheck the release gap after leaving the queue.
concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: none

env:
  LECTURN_HOSTED_APP_URL: ${{ vars.LECTURN_HOSTED_APP_URL }}
  VITE_HOSTED_APP_URL: ${{ vars.LECTURN_HOSTED_APP_URL }}
  LECTURN_POSTHOG_KEY: ${{ vars.LECTURN_POSTHOG_KEY }}
  LECTURN_POSTHOG_HOST: ${{ vars.LECTURN_POSTHOG_HOST }}

jobs:
  # Picks the commit every later job builds. Nightlies and tag pushes build the
  # triggering commit. Manual stable releases build the commit of the latest
  # published nightly, so stable ships source that nightly users have already
  # run. Scheduled runs also decide here whether a nightly is due.
  resolve_commit:
    name: Resolve release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      nightly_version: ${{ steps.resolve.outputs.nightly_version }}
      has_changes: ${{ steps.resolve.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - id: resolve
        name: Resolve release commit
        uses: actions/github-script@v8
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const {
              assertCommitOnDefaultBranch,
              assertReleaseSource,
              shouldReleaseNightly,
              resolveLatestNightlyCommit,
            } = require('./.github/scripts/check-nightly-release.cjs');

            const dispatchChannel = process.env.DISPATCH_CHANNEL || 'stable';
            const releaseChannel = context.eventName === 'schedule'
              ? 'nightly'
              : context.eventName === 'workflow_dispatch'
                ? dispatchChannel
                : 'stable';

            await assertReleaseSource({ github, context, releaseChannel });

            if (context.eventName === 'schedule') {
              core.setOutput('has_changes', await shouldReleaseNightly({ github, context, core }));
              core.setOutput('ref', context.sha);
            } else if (context.eventName === 'workflow_dispatch' && dispatchChannel === 'stable') {
              const { tag, sha, version } = await resolveLatestNightlyCommit({ github, context, core });
              await assertCommitOnDefaultBranch({ github, context, sha });
              core.notice(`Stable release builds ${sha}, the commit shipped by ${tag}.`);
              core.setOutput('ref', sha);
              core.setOutput('nightly_version', version);
            } else {
              core.setOutput('ref', context.sha);
            }

  preflight:
    name: Preflight
    needs: [resolve_commit]
    if: |
      needs.resolve_commit.result == 'success' &&
      (github.event_name != 'schedule' || needs.resolve_commit.outputs.has_changes == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      stave_tag: ${{ steps.stave_tag.outputs.stave_tag }}
      ref: ${{ needs.resolve_commit.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_commit.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          NIGHTLY_VERSION: ${{ needs.resolve_commit.outputs.nightly_version }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ needs.resolve_commit.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-stable}" == "nightly" ) ]]; then
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              raw="${DISPATCH_VERSION:-$NIGHTLY_VERSION}"
              if [[ -z "$raw" ]]; then
                echo "workflow_dispatch stable releases need a version input or a published nightly." >&2
                exit 1
              fi
            else
              raw="${GITHUB_REF_NAME}"
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=Lecturn v$version" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      # Resolve the bundled Stave release once so every build and publish job
      # pins the same tag, even when the input is `latest` and a new Stave
      # release lands mid-run. Inputs are empty on tag and schedule events, so
      # those always resolve latest.
      - id: stave_tag
        name: Resolve Stave release tag
        shell: bash
        env:
          STAVE_VERSION_INPUT: ${{ inputs.stave_version || 'latest' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-stave.ts \
            --resolve-only \
            --version "${STAVE_VERSION_INPUT:-latest}" \
            --github-output

      - name: Record bundled Stave tag
        env:
          STAVE_TAG: ${{ steps.stave_tag.outputs.stave_tag }}
        run: |
          echo "- Bundled Stave: \`${STAVE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
      # Share only the verification results, not the large registry metadata cache.
      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl

  quality:
    name: Release quality checks
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # GitHub-hosted 4-vCPU runners need more than upstream's 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @lecturn/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # The web package's browser project runs React tests in headless Chromium.
      - name: Install Chromium for web browser tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run test

  # The Linux x64 CLI archive is built first and on its own: it is both a
  # release asset and the WSL runtime the Windows desktop build embeds
  # verbatim, so the Windows matrix leg downloads it from here.
  build_linux_cli:
    name: Build CLI archive (linux-x64)
    needs: [preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      LECTURN_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      LECTURN_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      LECTURN_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      LECTURN_RELAY_URL: https://${{ vars.RELAY_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Install CLI dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=lecturn... --filter=@lecturn/web... --filter=@lecturn/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # The lecturn build task depends on @lecturn/web#build, so apps/server/dist
      # holds the server bundle plus the web client the archive serves.
      - name: Build server bundle and web client
        run: vp run --filter lecturn build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/lecturn-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      - name: Fetch Stave binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-stave.ts \
            --platform-key linux-x64 \
            --version "${{ needs.preflight.outputs.stave_tag }}" \
            --out "$GITHUB_WORKSPACE/stave-bin"

      # Keep VP_NODE_VERSION in step with SEA_NODE_VERSION in
      # apps/server/vite.config.ts; only exact versions have a nodejs.org dist.
      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --stave-binary "$GITHUB_WORKSPACE/stave-bin/linux-x64/stave" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    # build_linux_cli stays in `needs` so it runs first and its archive is
    # available to download, but only the Windows matrix entry consumes it (as
    # the WSL runtime). We therefore gate the job on preflight (must succeed)
    # WITHOUT requiring build_linux_cli, so a failed Linux CLI build doesn't
    # skip the macOS/Linux builds. `!cancelled()` (not `!failure()`) lets the
    # job run even when build_linux_cli failed; the Windows-only download step
    # below then fails that single platform if the archive is missing.
    # Matrix legs with cli_archive also build their platform's CLI archive.
    # macOS x64 has none: Node single-executables are unsupported there.
    needs: [preflight, build_linux_cli]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: production
    env:
      LECTURN_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      LECTURN_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      LECTURN_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      LECTURN_RELAY_URL: https://${{ vars.RELAY_DOMAIN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            cli_archive: true
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
            cli_archive: false
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            # Built by build_linux_cli.
            cli_archive: false
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
            cli_archive: true
          # - label: Windows arm64
          #   runner: windows-11-arm
          #   platform: win
          #   target: nsis
          #   arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Verify Lecturn public configuration
        shell: bash
        run: |
          for name in LECTURN_HOSTED_APP_URL LECTURN_CLERK_PUBLISHABLE_KEY LECTURN_CLERK_JWT_TEMPLATE LECTURN_CLERK_CLI_OAUTH_CLIENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Lecturn release configuration: $name" >&2
              exit 1
            fi
          done
          if [[ -z "${LECTURN_RELAY_URL#https://}" ]]; then
            echo "Missing required Lecturn release configuration: RELAY_DOMAIN" >&2
            exit 1
          fi

      # Windows installs straight from the registry. There, linking the packages
      # takes the time, not downloading them, so a package cache restore did not
      # pay for itself (measured upstream across nightlies on x64 and arm64).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        env:
          # The CDN serves this script as octet-stream, which PowerShell reads as
          # bytes. Use upstream's text/plain copy until the installer decodes it.
          VP_LEGACY_INSTALLER_URL: ${{ matrix.platform == 'win' && 'https://raw.githubusercontent.com/voidzero-dev/vite-plus/9fd0d0ae6e775db361d3d5f9f3a18b47bc195420/packages/cli/install-legacy.ps1' || '' }}
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      # pnpm checks the lockfile and policy before reusing this result. A missing
      # artifact leaves the cache empty, so installation runs the checks again.
      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Install desktop dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=@lecturn/desktop... --filter=lecturn... --filter=@lecturn/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/lecturn-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        if: matrix.platform == 'linux'
        id: capture_helper_cache
        uses: actions/cache@v6
        with:
          path: |
            native/kde-snap-shot/target/${{ matrix.rust_target }}/release/lecturn-kde-snap-shot
            native/hyprland-snap-shot/target/${{ matrix.rust_target }}/release/lecturn-hyprland-snap-shot
          key: linux-capture-helpers-${{ matrix.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || (matrix.platform == 'linux' && steps.capture_helper_cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Fetch Stave binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-stave.ts \
            --platform-key "${{ matrix.resource_key }}" \
            --version "${{ needs.preflight.outputs.stave_tag }}" \
            --out "$GITHUB_WORKSPACE/stave-bin"

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - uses: ./.github/actions/setup-apt-mirrors
        if: matrix.platform == 'linux'

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
              magick -version
          else
              convert -version
          fi

      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; skipping TrustedSigning module preparation."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Fetch pinned private extensions helper
        if: matrix.platform == 'mac' && github.repository == 'Nurozen/lecturn'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EXTENSIONS_ARTIFACT_READ_TOKEN }}
          HELPER_COMMIT: ${{ vars.EXTENSIONS_HELPER_COMMIT }}
          HELPER_ARCHIVE_SHA256: ${{ vars.EXTENSIONS_HELPER_ARCHIVE_SHA256 }}
          HELPER_TEAM: ${{ vars.EXTENSIONS_HELPER_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$HELPER_COMMIT" =~ ^[a-f0-9]{40}$ ]] && [[ "$HELPER_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test -n "$GH_TOKEN"
          tag="extensions-helper-$HELPER_COMMIT-$HELPER_ARCHIVE_SHA256"
          gh api "repos/Nurozen/lecturn-extensions/releases/tags/$tag" > "$RUNNER_TEMP/extensions-release.json"
          jq -e --arg commit "$HELPER_COMMIT" --arg tag "$tag" '.immutable == true and .draft == false and .tag_name == $tag and .target_commitish == $commit and ([.assets[] | select(.name == "helper.zip")] | length == 1)' "$RUNNER_TEMP/extensions-release.json"
          asset_id=$(jq -r '.assets[] | select(.name == "helper.zip") | .id' "$RUNNER_TEMP/extensions-release.json")
          [[ "$asset_id" =~ ^[0-9]+$ ]]
          gh api -H 'Accept: application/octet-stream' "repos/Nurozen/lecturn-extensions/releases/assets/$asset_id" > "$RUNNER_TEMP/extensions-helper.zip"
          python3 scripts/extract-extensions-artifact.py --archive "$RUNNER_TEMP/extensions-helper.zip" --output "$RUNNER_TEMP/extensions-helper" --sha256 "$HELPER_ARCHIVE_SHA256" --commit "$HELPER_COMMIT" --team "$HELPER_TEAM"

      - name: Build desktop artifact
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
          LECTURN_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          LECTURN_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              # electron-builder uses the certificate password to unlock its
              # generated keychain. Import into an explicit keychain instead.
              original_umask="$(umask)"
              umask 077
              signing_dir="$(mktemp -d "$RUNNER_TEMP/lecturn-signing.XXXXXX")"
              keychain_path="$signing_dir/signing.keychain-db"
              keychain_password="$(openssl rand -hex 32)"
              echo "::add-mask::$keychain_password"
              original_keychains=()
              while IFS= read -r original_keychain; do
                original_keychains+=("$original_keychain")
              done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
              cleanup_signing() {
                security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
                security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
                rm -rf "$signing_dir"
              }
              trap cleanup_signing EXIT

              certificate_path="$signing_dir/certificate.p12"
              printf '%s' "$CSC_LINK" | base64 -D > "$certificate_path"
              security create-keychain -p "$keychain_password" "$keychain_path"
              security set-keychain-settings -lut 21600 "$keychain_path"
              security unlock-keychain -p "$keychain_password" "$keychain_path"
              # codesign still searches the user's keychain list even with
              # --keychain. Preserve its entries so certificate chains resolve.
              security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
              security import "$certificate_path" -k "$keychain_path" \
                -T /usr/bin/codesign -T /usr/bin/productbuild -P "$CSC_KEY_PASSWORD"
              security set-key-partition-list -S apple-tool:,apple: -s \
                -k "$keychain_password" "$keychain_path" >/dev/null
              export CSC_KEYCHAIN="$keychain_path"
              unset CSC_LINK CSC_KEY_PASSWORD

              key_path="$signing_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              if has_all "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
                profile_path="$signing_dir/lecturn.provisionprofile"
                printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
                security cms -D -i "$profile_path" >/dev/null
                export LECTURN_APPLE_TEAM_ID="$APPLE_TEAM_ID"
                export LECTURN_MACOS_PROVISIONING_PROFILE="$profile_path"
              else
                echo "::notice::macOS passkey entitlements disabled (no team id / provisioning profile)"
              fi

              umask "$original_umask"
              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            # Embed the Linux CLI archive from build_linux_cli as the WSL
            # runtime; it carries the Linux Stave binary for the WSL backend.
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/lecturn-*-linux-x64.tar.gz)
            # The Windows app runs stave.exe natively.
            args+=(--stave-binary "$GITHUB_WORKSPACE/stave-bin/${{ matrix.resource_key }}/stave.exe")
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing one or more Azure Trusted Signing secrets)."
            fi
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          # Bundle the Stave binary fetched above for this platform. CI never
          # passes --allow-missing-stave: a release without Stave is a failure.
          if [[ "${{ matrix.platform }}" != "win" ]]; then
            args+=(--stave-binary "$GITHUB_WORKSPACE/stave-bin/${{ matrix.resource_key }}/stave")
          fi

          if [[ "${{ matrix.platform }}" == "mac" && "${{ github.repository }}" == "Nurozen/lecturn" ]]; then
            args+=(--extensions-resources "$RUNNER_TEMP/extensions-helper")
          fi
          vp run dist:desktop:artifact "${args[@]}"

      # The single-executable is built with a Node that supports --build-sea
      # (25.7+); the repo itself stays on the engines.node version. Keep
      # VP_NODE_VERSION in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
      - name: Build CLI single-executable
        if: matrix.cli_archive
        shell: bash
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      # Without signing secrets the archive's executable is signed ad hoc,
      # which Apple Silicon accepts but Gatekeeper warns about on download.
      - name: Import macOS signing certificate for the CLI archive
        if: matrix.cli_archive && matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "macOS CLI signing disabled (missing CSC_LINK); the archive is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/lecturn-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          cert_path="$RUNNER_TEMP/lecturn-cli-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$cert_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in CSC_LINK." >&2
            exit 1
          fi
          echo "LECTURN_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "macOS CLI signing enabled."

      - name: Build CLI archive
        if: matrix.cli_archive
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          binary_name="lecturn-resource-monitor"
          stave_name="stave"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
            stave_name="stave.exe"
          fi
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$monitor_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}" "$monitor_dir/$binary_name"
          if [[ "${{ matrix.platform }}" == "mac" && -n "${APPLE_API_KEY:-}" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_cli_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
          fi
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --stave-binary "$GITHUB_WORKSPACE/stave-bin/${{ matrix.resource_key }}/$stave_name" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        if: matrix.cli_archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload CLI archive
        if: matrix.cli_archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.deb" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi

          # Enable if Windows arm64 builds are enabled.
          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "nightly.yml"). Suffix each per-arch copy so the
          # release job can merge matching arm64/x64 manifests back into one
          # canonical manifest per channel.
          # if [[ "${{ matrix.platform }}" == "win" ]]; then
          #   shopt -s nullglob
          #   for manifest in release-publish/*.yml; do
          #     mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
          #   done
          # fi

      - name: Collect resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="lecturn-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          source_path="native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}"
          target_dir="resource-monitor-publish/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

      - name: Upload resource monitor
        uses: actions/upload-artifact@v7
        with:
          name: resource-monitor-${{ matrix.resource_key }}
          path: resource-monitor-publish/${{ matrix.resource_key }}/*
          if-no-files-found: error

  publish_cli:
    name: Publish CLI to npm
    needs: [preflight, quality, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.quality.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      LECTURN_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      LECTURN_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      LECTURN_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      LECTURN_RELAY_URL: https://${{ vars.RELAY_DOMAIN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Verify Lecturn public configuration
        shell: bash
        run: |
          for name in LECTURN_HOSTED_APP_URL LECTURN_CLERK_PUBLISHABLE_KEY LECTURN_CLERK_JWT_TEMPLATE LECTURN_CLERK_CLI_OAUTH_CLIENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Lecturn release configuration: $name" >&2
              exit 1
            fi
          done
          if [[ -z "${LECTURN_RELAY_URL#https://}" ]]; then
            echo "Missing required Lecturn release configuration: RELAY_DOMAIN" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=lecturn...
              - --filter=@lecturn/web...
              - --filter=@lecturn/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # The lecturn build task depends on @lecturn/web#build, so the web client is
      # built (once) as part of this step.
      - name: Build CLI package
        run: vp run --filter lecturn build

      - name: Download resource monitors
        uses: actions/download-artifact@v8
        with:
          pattern: resource-monitor-*
          path: ${{ runner.temp }}/resource-monitors

      - name: Bundle resource monitors into CLI package
        shell: bash
        run: |
          set -euo pipefail
          for artifact_dir in "$RUNNER_TEMP"/resource-monitors/resource-monitor-*; do
            resource_key="${artifact_dir##*/resource-monitor-}"
            target_dir="apps/server/dist/resource-monitor/${resource_key}"
            mkdir -p "$target_dir"
            cp "$artifact_dir"/lecturn-resource-monitor* "$target_dir/"
            chmod +x "$target_dir"/lecturn-resource-monitor 2>/dev/null || true
          done

      # The CLI package ships Stave for every supported platform key, not just
      # the four the desktop matrix builds, so users on any host get a binary.
      - name: Bundle Stave binaries into CLI package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-stave.ts \
            --all \
            --version "${{ needs.preflight.outputs.stave_tag }}" \
            --out apps/server/dist/stave

      - name: Publish CLI package
        run: node apps/server/scripts/cli.ts publish --tag "${{ needs.preflight.outputs.cli_dist_tag }}" --app-version "${{ needs.preflight.outputs.version }}" --package-name lecturn --bin-name lecturn --require-stave --verbose

  release:
    name: Publish GitHub Release
    needs: [preflight, build_linux_cli, build, publish_cli]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build_linux_cli.result == 'success' && needs.build.result == 'success' && needs.publish_cli.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers verify archives against this file, so it is written from the
      # signed bytes that get uploaded, never from an earlier stage.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(lecturn-*.tar.gz lecturn-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Merge macOS updater manifests
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          draft: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '.isDraft == true and (.assets | length > 0)' | grep -qx true
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$MAKE_LATEST"

  finalize:
    name: Finalize release
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' }}
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/scripts...
              - --filter=@lecturn/oxlint-plugin-lecturn...

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Open version bump pull request and run CI
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml)
          if git diff --quiet -- "${files[@]}"; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="release/version-${RELEASE_TAG}"
          git check-ref-format "refs/heads/$branch"
          git add -- "${files[@]}"

          if [[ -n "$(git ls-remote --heads origin "refs/heads/$branch")" ]]; then
            git fetch origin "refs/heads/$branch"
            # Never overwrite an existing branch. Reuse it only if it contains
            # exactly these generated files and their expected contents.
            unexpected=$(git diff --name-only HEAD...FETCH_HEAD -- . \
              ':!apps/server/package.json' ':!apps/desktop/package.json' \
              ':!apps/web/package.json' ':!packages/contracts/package.json' ':!pnpm-lock.yaml')
            if [[ -n "$unexpected" ]] || ! git diff --cached --quiet FETCH_HEAD -- "${files[@]}"; then
              echo "Existing $branch differs from this version bump; inspect its pull request before retrying." >&2
              exit 1
            fi
          else
            git commit -m "chore(release): prepare $RELEASE_TAG"
            git push origin "HEAD:refs/heads/$branch"
          fi

          pr_url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr_url" ]]; then
            body_file="$RUNNER_TEMP/release-version-pr.md"
            cat > "$body_file" <<EOF
          Release $RELEASE_TAG is published. Update the workspace package versions to match it.

          Generated by the release workflow. CI runs explicitly on this branch; merge after the required checks pass.
          EOF
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore(release): prepare $RELEASE_TAG" --body-file "$body_file")
          fi

          pr_number=$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')
          # A GITHUB_TOKEN push does not start push CI. Explicit dispatch also
          # avoids waiting for approval of token-created pull-request events.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
            -f "pull_request_number=$pr_number"
          printf 'Version bump: %s\n\nCI dispatched for `%s`. Merge the pull request after required checks pass.\n' \
            "$pr_url" "$branch" >> "$GITHUB_STEP_SUMMARY"
