# Fork-only workflow: keeps the `t3mirror` branch a pristine copy of
# pingdotgg/t3code main.
#
# This job does not touch `main`. It only force-updates the mirror, which
# gives the rest of the fork two things:
#   - a stable ref to diff and merge upstream from, without adding a remote
#   - a base to cut upstream-bound PR branches from, so they cannot carry
#     fork-only commits
#
# The local run-batches.py controller consumes this branch one reviewed
# checkpoint PR at a time. The Actions integration workflow is informational.
#
# Tags are never fetched: upstream `v*` tags would otherwise trigger this
# fork's release pipeline.
#
# Failure mode to know about: GitHub suspends scheduled workflows after 60
# days without repository activity. Any push re-arms it, and `workflow_dispatch`
# always works.
name: t3mirror Sync

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: t3mirror-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: pingdotgg/t3code
  UPSTREAM_BRANCH: main
  MIRROR_BRANCH: t3mirror

jobs:
  mirror:
    # Guard against ever running in the upstream repository.
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: false

      - name: Update mirror branch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          if git ls-remote --exit-code --heads origin "${MIRROR_BRANCH}" >/dev/null 2>&1; then
            current="$(git ls-remote --heads origin "${MIRROR_BRANCH}" | cut -f1)"
            if [ "$current" = "$upstream_sha" ]; then
              echo "Mirror already at ${upstream_sha}."
              exit 0
            fi
          fi

          git push --force origin \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${MIRROR_BRANCH}"
          echo "Mirror updated to ${upstream_sha}."
