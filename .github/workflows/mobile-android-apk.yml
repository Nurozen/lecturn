name: Mobile Android APK

# Checks the Google Play Alpha closed-testing track hourly. Each new beta gets
# one versioned android-beta-<build> prerelease. Unchanged checks publish
# nothing. Play re-signs uploaded bundles with the app signing key, so its
# universal APK matches the Play install and needs no signing secrets here.
#
# Inactive in Lecturn: the fork has no GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret
# and no Play distribution yet, so the job skips itself. See
# docs/operations/release.md#android-apk-mirror.
on:
  schedule:
    # Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: mobile-android-apk
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PACKAGE_NAME: com.cloudgatherer.lecturn
    steps:
      - id: credentials
        name: Check for Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not available; skipping APK mirror."
          fi

      - name: Checkout
        if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Mirror the newest APK
        if: steps.credentials.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/mirror-play-apk.cjs
