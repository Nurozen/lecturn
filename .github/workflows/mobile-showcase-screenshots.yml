                        try { target = (${targetMetadataSource})([pairingUrl])[0]; } catch {}
                        try { (${recorderSource})({ _tag: 'Initial' }, __lecturnKnownObservations, invocationId, 'invoke', target); } catch {}
                        let result;
                        try { result = await connectPairingUrl(pairingUrl); }
                        catch (error) {
                          try { (${recorderSource})({ _tag: 'Failure', cause: { reasons: [{ _tag: 'Die', defect: error }] } }, __lecturnKnownObservations, invocationId, 'throw', target); } catch {}
                          throw error;
                        }
                        try { (${recorderSource})(result, __lecturnKnownObservations, invocationId, 'result', target); } catch {}
                        return AsyncResult.isSuccess(result);
                      }`;
          const runtimePrelude = 'const __lecturnKnownObservations = new WeakSet();\nlet __lecturnInvocationId = 0;\n';
          let context;
          
          export function observeTransformInput(input) {
            if (!context || process.env.REUSE8_PAIRING_OBSERVER !== '1' ||
                typeof input.filename !== 'string' || input.options?.platform !== 'ios' ||
                input.options?.dev !== true || input.options?.projectRoot !== context.mobileRoot ||
                path.resolve(input.options.projectRoot, input.filename) !== context.filename) return input;
            if (typeof input.src !== 'string' || sha256(input.src) !== PINS.sourceSha256) {
              throw new Error('PAIRING_OBSERVER_SOURCE_PIN_MISMATCH');
            }
            if (input.src.split(PINS.anchor).length !== 2) throw new Error('PAIRING_OBSERVER_ANCHOR_MISMATCH');
            const src = runtimePrelude + input.src.replace(PINS.anchor, replacement);
            const receipt = {
              schema: 1, diagnosticInstrumentedBundle: true,
              disclosure: 'Diagnostic instrumented JavaScript; not exact uninstrumented product JavaScript.',
              productTree: PINS.productTree, reusedNativeArchiveSha256: PINS.nativeArchiveSha256,
              nativeArchiveModified: false, sourcePath: PINS.sourcePath,
              installedTransformer: '@expo/metro-config/build/babel-transformer.js',
              originalSourceSha256: PINS.sourceSha256, transformedSourceSha256: sha256(src),
              originalTransformerSha256: PINS.transformerSha256,
              hookedTransformerSha256: context.hookedTransformerSha256,
              observerSha256, recorderSha256: sha256(recorderSource), anchorSha256: sha256(PINS.anchor),
              platform: 'ios', dev: true, activation: 'REUSE8_PAIRING_OBSERVER=1',
              transformStage: 'src before original Babel transform',
            };
            const directory = path.join(context.workspace, 'artifacts/ios-validation');
            mkdirSync(directory, { recursive: true });
            const pendingReceipt = path.join(directory, `pairing-result-observer-receipt.${process.pid}.tmp`);
            writeFileSync(pendingReceipt, JSON.stringify(receipt, null, 2) + '\n');
            renameSync(pendingReceipt, path.join(directory, 'pairing-result-observer-receipt.json'));
            return { ...input, src };
          }
          
          if (process.env.REUSE8_PAIRING_OBSERVER === '1') {
            if (!process.env.GITHUB_WORKSPACE || !path.isAbsolute(process.env.GITHUB_WORKSPACE)) {
              throw new Error('PAIRING_OBSERVER_WORKSPACE_REQUIRED');
            }
            const workspace = realpathSync(process.env.GITHUB_WORKSPACE);
            const mobileRoot = path.join(workspace, 'apps/mobile');
            const mobileRequire = createRequire(path.join(mobileRoot, 'package.json'));
            const expoRequire = createRequire(mobileRequire.resolve('expo/package.json'));
            const transformerPath = realpathSync(expoRequire.resolve('@expo/metro-config/build/babel-transformer.js'));
            const transformerUrl = pathToFileURL(transformerPath).href;
            context = { workspace, mobileRoot, filename: path.join(workspace, PINS.sourcePath) };
            registerHooks({
              load(url, loadContext, nextLoad) {
                const loaded = nextLoad(url, loadContext);
                if (url !== transformerUrl || process.env.REUSE8_PAIRING_OBSERVER !== '1') return loaded;
                const original = typeof loaded.source === 'string' ? loaded.source : Buffer.from(loaded.source).toString('utf8');
                if (sha256(original) !== PINS.transformerSha256) throw new Error('PAIRING_OBSERVER_TRANSFORMER_PIN_MISMATCH');
                const source = original + `\nconst __lecturnPairingObserver = require(${JSON.stringify(observerPath)});
          const __lecturnOriginalTransform = module.exports.transform;
          module.exports.transform = function(input, ...rest) {
            return Reflect.apply(__lecturnOriginalTransform, this, [__lecturnPairingObserver.observeTransformInput(input), ...rest]);
          };
          const __lecturnOriginalCacheKey = module.exports.getCacheKey;
          module.exports.getCacheKey = function(...args) {
            const originalKey = Reflect.apply(__lecturnOriginalCacheKey, this, args);
            return process.env.REUSE8_PAIRING_OBSERVER === '1' ? originalKey + ':lecturn-pairing-observer:${observerSha256}' : originalKey;
          };\n`;
                context.hookedTransformerSha256 = sha256(source);
                return { ...loaded, source };
              },
            });
          }
          PAIRING_OBSERVER_11
          export REUSE8_PAIRING_OBSERVER=1
          export REUSE8_BACKEND_OBSERVER_REPO="$GITHUB_WORKSPACE"
          export REUSE8_BACKEND_OBSERVER_LOG="$GITHUB_WORKSPACE/artifacts/ios-validation/backend-http.jsonl"
          export NODE_OPTIONS="--import=$RUNNER_TEMP/metro-request-observer.mjs --import=$RUNNER_TEMP/metro-runtime-memo.mjs --import=$RUNNER_TEMP/reuse8-backend-observer.mjs --import=$RUNNER_TEMP/pairing-result-observer-reuse11.mjs"
          python3 "$RUNNER_TEMP/ios-phase-driver.py" start

      - name: Upload native startup diagnostics before scene gate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-startup-diagnostics
          path: artifacts/ios-validation/
          if-no-files-found: warn
          retention-days: 7

      - name: Complete single iOS diagnostic scene gate
        if: always()
        timeout-minutes: 12
        run: python3 "$RUNNER_TEMP/ios-phase-driver.py" finish

      - name: Stop remaining owned capture process
        if: always()
        run: python3 "$RUNNER_TEMP/ios-phase-driver.py" cleanup

      - name: Validate App Store Connect assets
        run: node scripts/mobile-showcase.ts --platform ios --device iphone-6.9 --scene thread --appearance light --theme lecturn --validate-only

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-screenshots
          path: artifacts/app-store/screenshots/apple/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain simulator build and provenance
        if: always()
        run: |
          mkdir -p artifacts/ios-validation
          git rev-parse HEAD > artifacts/ios-validation/validation-commit.txt
          git status --porcelain > artifacts/ios-validation/post-prebuild-status.txt
          cp "$RUNNER_TEMP/lecturn-link-fixture.mjs" artifacts/ios-validation/fixture-preload.mjs
          cp "$RUNNER_TEMP/pairing-result-observer-reuse11.mjs" "$RUNNER_TEMP/ios-link-scene-assert.py" "$RUNNER_TEMP/reuse8-backend-observer.mjs" "$RUNNER_TEMP/metro-runtime-memo.mjs" "$RUNNER_TEMP/ios-driver-warmup.py" "$RUNNER_TEMP/ios-metro-preflight.py" "$RUNNER_TEMP/ios_owned_processes.py" "$RUNNER_TEMP/ios-native-launch.py" "$RUNNER_TEMP/ios-native-launch.yaml" "$RUNNER_TEMP/ios-runtime-probe.mjs" "$RUNNER_TEMP/ios-phase-driver.py" "$RUNNER_TEMP/ios-startup-diagnostics.py" "$RUNNER_TEMP/metro-request-observer.mjs" "$RUNNER_TEMP/ios-url-probe.swift" artifacts/ios-validation/
          ios_products=apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          if [ -d "$ios_products/Lecturn.app" ]; then
            tar -czf artifacts/ios-validation/Lecturn-simulator.app.tgz -C "$ios_products" Lecturn.app
          fi

      - name: Upload validation diagnostics and reusable app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-link-validation-reuse-diagnostics
          path: artifacts/ios-validation/
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android phone, 7-inch tablet, and 10-inch tablet
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 80 }}
    env:
      LECTURN_SHOWCASE_ANDROID_ABI: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android showcase
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 8
          ram-size: 4096M
          disable-animations: false
          script: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}"

      - name: Validate Google Play assets
        run: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}" --validate-only

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-play-screenshots
          path: artifacts/app-store/screenshots/google-play/
          if-no-files-found: warn
          retention-days: 14
