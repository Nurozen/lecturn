name: Mobile Showcase Screenshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Device platforms to capture
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      appearance:
        description: System appearances to capture
        required: true
        default: both
        type: choice
        options:
          - both
          - dark
          - light
      theme:
        description: Palette to capture (all multiplies the run by six)
        required: true
        default: lecturn
        type: choice
        options:
          - lecturn
          - lecturn-chat
          - grove
          - ocean
          - ember
          - iris
          - all

permissions:
  contents: read
  actions: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  ios:
    name: iPhone 6.9, iPhone 6.5, and iPad 13
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-26
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 80 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Download exact reusable simulator app
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: Nurozen/lecturn
          run-id: 38370249415
          name: ios-diagnostic-native-build
          path: artifacts/ios-reuse-input

      - name: Verify and install reusable app artifact
        run: |
          echo '93eb97fc295d30ef68ac02eca7f7db35f1b9b96ce68f2323e73e9aea28a99b69  artifacts/ios-reuse-input/Lecturn-diagnostic-simulator.app.tgz' | shasum -a 256 -c -
          test "$(cat artifacts/ios-reuse-input/validation-commit.txt)" = '8865619b21f8696ec622d2d7f05c8ff9e7c3a0d4'
          mkdir -p apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          tar -xzf artifacts/ios-reuse-input/Lecturn-diagnostic-simulator.app.tgz -C apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator/Lecturn.app/Info.plist
          echo 'a5daa80171a3526be43a9ac71c30459eb9fa43647d53ffc130e82bc15a7791e9  apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator/Lecturn.app/Lecturn.debug.dylib' | shasum -a 256 -c -
          cmp artifacts/ios-reuse-input/LecturnMarkdownText.diagnostic.mm apps/mobile/modules/lecturn-markdown-text/ios/LecturnMarkdownText.mm

      - name: Install pinned local native UI driver
        run: |
          curl --fail --location --silent --show-error 'https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip' -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/maestro/bin/maestro" --version

      - name: Capture native startup diagnostics
        timeout-minutes: 20
        env:
          EXPO_PUBLIC_SHOWCASE: '1'
          MAESTRO_CLI_NO_ANALYTICS: '1'
