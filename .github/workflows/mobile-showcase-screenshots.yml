                      raise GateFailure('Owned action group did not stop; refusing another device command.')
                  if receipt['exit_code'] != 0:
                      raise GateFailure('Command failed at ' + stage + '; inspect retained diagnostics.')
          
              def flow(self, stage, body):
                  flow = self.path / (stage + '.yaml')
                  flow.write_text('appId: com.cloudgatherer.lecturn\n---\n' + body)
                  self.command(stage, [str(self.maestro), '--device', self.udid, 'test', '--debug-output', str(self.path / (stage + '-debug')), str(flow)])
          
              def observer_read(self):
                  stage = 'observer-read'
                  receipt = self.result['observer'] = {'accepted': False, 'dump_complete': False,
                                                      'cleanup_verified': False, 'exit_code': None}
                  self.observer_cleanup_verified = False
                  self.checkpoint()
                  process = None
                  output = self.path / 'observer-read.json'
                  records = []
                  try:
                      if WORK_SECONDS - (time.monotonic()-self.started) < OBSERVER_SECONDS + CLEANUP_SECONDS:
                          raise GateFailure('Insufficient observer read/cleanup work reserve.')
                      if (any(row['pid'] not in self.cleaned for row in self.groups.values())
                              or any(not row['stopped'] for row in self.result['cleanup'])):
                          raise GateFailure('Owned initial group did not stop; refusing observer read.')
                      runner = Path(__file__).resolve().parent
                      with (self.path / 'observer-read.log').open('wb') as log:
                          try:
                              with self.limit(OBSERVER_SECONDS, work=True) as timeout:
                                  deadline = time.monotonic() + timeout
                                  process = self.start([sys.executable, str(runner / 'ios-filechip-observer-read.py'),
                                                        self.udid, '--diagnostic-dylib-sha256', self.diagnostic_dylib_sha256,
                                                        '--output', str(output)], stage, log, subprocess.STDOUT)
                                  receipt['exit_code'] = process.wait(timeout=max(0, deadline-time.monotonic()))
                          except (CommandDeadline, subprocess.TimeoutExpired):
                              receipt['timed_out'] = True
                          finally:
                              records = [row for row in self.groups.values() if row['purpose'] == self.prefix + '-' + stage]
                              for row in records:
                                  self.stop(row)
