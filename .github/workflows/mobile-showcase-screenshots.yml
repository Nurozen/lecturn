name: C39 natural history disclosure diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-ios-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    name: C39 ${{ matrix.CAPTURE_CASE }} run ${{ github.run_id }} attempt ${{ github.run_attempt }}
    runs-on: macos-26
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - CAPTURE_CASE: ownership-full
            VARIANT: 'after'
            CAPTURE_SCENARIOS: 'ownership'
            SOURCE_COMMIT: 'b7aac327699eaa141ee6730c6c8a9aedda8cc032'
            SOURCE_TREE: 'c9f7c8145531e57625068a6ada8b3a1c94449eaf'
            BUILD_RUN_ID: '38680507825'
            BUILD_COMMIT: 'ac51e13f2c0e287fd58261b2c82ffcbea2e98bfa'
            BUILD_ARCHIVE_HASH: 'a52ff786672cddeddd8731b89952300bcbfc06ded4e8712df421973005b83349'
            BUILD_ARTIFACT: ios-after-native-build
    env:
      CAPTURE_PROTOCOL: 'C36-natural-history-disclosure-diagnostic-v1'
      CAPTURE_CASE: ${{ matrix.CAPTURE_CASE }}
      VARIANT: ${{ matrix.VARIANT }}
      CAPTURE_SCENARIOS: ${{ matrix.CAPTURE_SCENARIOS }}
      SOURCE_COMMIT: ${{ matrix.SOURCE_COMMIT }}
      SOURCE_TREE: ${{ matrix.SOURCE_TREE }}
      BUILD_RUN_ID: ${{ matrix.BUILD_RUN_ID }}
      BUILD_COMMIT: ${{ matrix.BUILD_COMMIT }}
      BUILD_ARCHIVE_HASH: ${{ matrix.BUILD_ARCHIVE_HASH }}
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Materialize immutable exact public source
        shell: bash
        run: |
          set -euo pipefail
          test "$CAPTURE_PROTOCOL" = "C36-natural-history-disclosure-diagnostic-v1"
          test "$VARIANT" = "after"
          test "$CAPTURE_SCENARIOS" = "ownership"
          test "$SOURCE_COMMIT" = "b7aac327699eaa141ee6730c6c8a9aedda8cc032"
          test "$SOURCE_TREE" = "c9f7c8145531e57625068a6ada8b3a1c94449eaf"
          test "$BUILD_RUN_ID" = "38680507825"
          test "$BUILD_COMMIT" = "ac51e13f2c0e287fd58261b2c82ffcbea2e98bfa"
          test "$BUILD_ARCHIVE_HASH" = "a52ff786672cddeddd8731b89952300bcbfc06ded4e8712df421973005b83349"
          case "$CAPTURE_CASE" in ownership-full) ;; *) exit 1 ;; esac
          git init .
          git remote add origin https://github.com/Nurozen/lecturn.git
          git config core.sparseCheckout true
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c protocol.file.allow=never -c submodule.recurse=false fetch --no-tags --depth=1 --filter=blob:none origin "$SOURCE_COMMIT"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          git -c protocol.file.allow=never -c submodule.recurse=false fetch --no-tags --depth=1 --filter=blob:none origin 65318f080902a00d1b421ff86755f1a4a75e8b5b
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test ! -e .env
          test ! -e .env.local
          test ! -e apps/mobile/.env
          test ! -e apps/mobile/.env.local
