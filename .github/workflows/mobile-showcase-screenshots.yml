                NSString *rendered = attr.string ?: @"";
                NSMutableArray *runs = [NSMutableArray array];
                NSUInteger offset = 0, runIndex = 0, reportRuns = 0;
                NSRange reportRange = NSMakeRange(0, 0);
                for (NSUInteger si = 0; si < view.subviews.count; ++si) {
                  UIView *child = view.subviews[si];
                  if (![child isKindOfClass:runClass]) continue;
                  if (![child respondsToSelector:@selector(text)] ||
                      ![child respondsToSelector:@selector(hasContextMenu)]) @throw @"missing_run_selector";
                  NSString *text = [(id)child text] ?: @"";
                  NSRange runRange = NSMakeRange(offset, text.length);
                  if ([text rangeOfString:@"report.pdf"].location != NSNotFound) {
                    reportRuns++;
                    reportRange = runRange;
                  }
                  NSString *config = (NSString *)object_getIvar(child, configIvar);
                  if (config && ![config isKindOfClass:[NSString class]]) @throw @"unexpected_config_type";
                  NSMutableArray *ids = [NSMutableArray array];
                  NSString *configStatus = @"empty";
                  if (config.length) {
                    id parsed = [NSJSONSerialization JSONObjectWithData:[config dataUsingEncoding:NSUTF8StringEncoding]
                                                               options:0 error:NULL];
                    configStatus = @"invalid";
                    if ([parsed isKindOfClass:[NSDictionary class]] && [parsed[@"actions"] isKindOfClass:[NSArray class]]) {
                      configStatus = @"parsed";
                      for (id action in parsed[@"actions"]) {
                        id actionID = [action isKindOfClass:[NSDictionary class]] ? action[@"id"] : nil;
                        [ids addObject:[knownIDs containsObject:actionID ?: @""] ? actionID : @"[redacted-action-id]"];
                      }
                    }
                  }
                  [runs addObject:@{@"index": @(runIndex++), @"subview_index": @(si),
                    @"address": [NSString stringWithFormat:@"%p", child], @"text": safeText(text),
                    @"utf16_length": @(text.length), @"range": rangeJSON(runRange),
                    @"hasContextMenu": @((BOOL)[(id)child hasContextMenu]),
                    @"config_utf16_length": @(config.length), @"config_status": configStatus, @"action_ids": ids}];
                  offset += text.length;
                }
                if (!reportRuns && [rendered rangeOfString:@"report.pdf"].location == NSNotFound) continue;
                NSMutableArray *attachments = [NSMutableArray array], *filenameLinks = [NSMutableArray array];
                NSDictionary *(^linkAt)(NSUInteger) = ^NSDictionary *(NSUInteger index) {
                  NSRange effective = NSMakeRange(0, 0);
                  id link = [attr attribute:NSLinkAttributeName atIndex:index effectiveRange:&effective];
                  return @{@"index": @(index), @"link_present": @(link != nil), @"effective_range": rangeJSON(effective)};
                };
                // Inspect every actual attachment, including ones outside the proposed run
                // range: a range mismatch must remain visible rather than be filtered out.
                for (NSUInteger i = 0; i < attr.length; ++i) {
                  if ([attr attribute:NSAttachmentAttributeName atIndex:i effectiveRange:NULL]) {
                    NSMutableDictionary *entry = [linkAt(i) mutableCopy];
                    entry[@"in_report_run"] = @(reportRuns == 1 && NSLocationInRange(i, reportRange));
                    entry[@"object_replacement_character"] = @([rendered characterAtIndex:i] == 0xfffc);
                    [attachments addObject:entry];
                  }
                }
                NSUInteger cursor = 0, filenames = 0;
                NSMutableArray *filenameRanges = [NSMutableArray array];
                while (cursor < rendered.length) {
                  NSRange r = [rendered rangeOfString:@"report.pdf" options:0 range:NSMakeRange(cursor, rendered.length-cursor)];
                  if (r.location == NSNotFound) break;
                  filenames++;
                  [filenameRanges addObject:rangeJSON(r)];
                  for (NSUInteger i = r.location; i < NSMaxRange(r); ++i) [filenameLinks addObject:linkAt(i)];
                  cursor = NSMaxRange(r);
                }
                id delegate = tv.delegate;
                [hosts addObject:@{@"address": [NSString stringWithFormat:@"%p", view],
                  @"class": NSStringFromClass([view class]), @"hidden": @(view.hidden), @"alpha": @(view.alpha),
                  @"window_address": [NSString stringWithFormat:@"%p", view.window],
                  @"textview_address": [NSString stringWithFormat:@"%p", tv],
                  @"delegate_class": delegate ? NSStringFromClass([delegate class]) : @"<nil>",
                  @"menu_delegate_selector": @([delegate respondsToSelector:@selector(textView:menuConfigurationForTextItem:defaultMenu:)]),
                  @"runs": runs, @"runs_utf16_length": @(offset), @"report_run_count": @(reportRuns),
                  @"report_run_range": rangeJSON(reportRange), @"attributed_utf16_length": @(attr.length),
                  @"filename_count": @(filenames), @"filename_ranges": filenameRanges,
                  @"filename_links": filenameLinks, @"attachments": attachments}];
              }
              out[@"views_scanned"] = @(scanned);
            } @catch (id exception) {
              NSArray *errors = @[@"not_main_thread", @"missing_native_classes", @"missing_native_ivars", @"view_limit",
                @"unexpected_textview", @"missing_run_selector", @"unexpected_config_type"];
              out[@"native_error"] = [errors containsObject:exception] ? exception : @"native_exception";
            }
            NSData *data = [NSJSONSerialization dataWithJSONObject:out options:0 error:NULL];
            (const char *)[[[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding] UTF8String];
          })'''
          
          
          class InspectionError(Exception):
              """Only fixed, credential-free reason codes are raised."""
          
          
          def interrupted(signum, frame):
              raise InspectionError('deadline' if signum == signal.SIGALRM else 'interrupted')
          
          
          @contextmanager
          def bounded(seconds):
              signal.setitimer(signal.ITIMER_REAL, seconds)
              try:
                  yield
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
          
          
          def read(command, label):
              if label not in READ_LABELS:
                  raise InspectionError('invalid_read_label')
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=5, check=False)
              except subprocess.TimeoutExpired:
                  raise InspectionError('read_command_timeout_' + label) from None
              except InspectionError as error:
                  if str(error) == 'deadline':
                      raise InspectionError('read_command_deadline_' + label) from None
                  raise
              if result.returncode:
                  raise InspectionError('read_command_failed_' + label)
              return result.stdout.strip()
          
          
          def service_pid(text):
              pattern = re.compile(r'UIKitApplication:' + re.escape(BUNDLE) + r'(?:\[[^\]\s]+\])+')
              rows = [row.split() for row in text.splitlines()]
              found = [row for row in rows if len(row) == 3 and pattern.fullmatch(row[2])]
              if len(found) != 1 or not found[0][0].isdigit() or int(found[0][0]) <= 1:
                  raise InspectionError('app_service_missing_or_ambiguous')
              return int(found[0][0]), found[0][2]
          
          
          def current_service(udid):
              return service_pid(read(['xcrun', 'simctl', 'spawn', udid, 'launchctl', 'list'], 'simulator_launchctl'))
          
          
          def process_info(pid):
              start = read(['ps', '-p', str(pid), '-o', 'lstart='], 'ps_start')
              executable = read(['ps', '-p', str(pid), '-o', 'comm='], 'ps_exe')
              state = read(['ps', '-p', str(pid), '-o', 'stat='], 'ps_state')
              if not start or not state or not executable:
                  raise InspectionError('app_identity_missing')
              return {'start': start, 'executable': executable, 'state': state}
          
          
          def sha256(path):
              digest = hashlib.sha256()
              deadline = time.monotonic() + 10
              with Path(path).open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      if time.monotonic() > deadline:
                          raise InspectionError('hash_deadline')
                      digest.update(chunk)
              return digest.hexdigest()
          
          
          def discover(udid):
              devices = json.loads(read(['xcrun', 'simctl', 'list', 'devices', '--json'], 'simulator_devices'))
              matches = [d for group in devices['devices'].values() for d in group if d['udid'].upper() == udid]
              if len(matches) != 1 or matches[0]['state'] != 'Booted':
                  raise InspectionError('exact_simulator_not_booted')
              pid, service = current_service(udid)
              container = Path(read(['xcrun', 'simctl', 'get_app_container', udid, BUNDLE, 'app'], 'simulator_container')).resolve()
              if udid not in (part.upper() for part in container.parts):
                  raise InspectionError('container_simulator_mismatch')
              with (container / 'Info.plist').open('rb') as stream:
                  info = plistlib.load(stream)
              if info.get('CFBundleIdentifier') != BUNDLE or info.get('CFBundleExecutable') != 'Lecturn':
                  raise InspectionError('installed_bundle_mismatch')
              identity = process_info(pid)
              if Path(identity['executable']).resolve() != container / 'Lecturn' or 'T' in identity['state']:
                  raise InspectionError('app_executable_mismatch_or_stopped')
              debug_hash = sha256(container / 'Lecturn.debug.dylib')
              if debug_hash != DEBUG_SHA256:
                  raise InspectionError('retained_debug_image_hash_mismatch')
              verify(udid, pid, service, identity)
              return pid, service, identity, container, debug_hash
          
          
          def verify(udid, pid, service, identity):
              if current_service(udid) != (pid, service):
                  raise InspectionError('app_service_changed')
              now = process_info(pid)
              if now['start'] != identity['start'] or now['executable'] != identity['executable']:
                  raise InspectionError('app_pid_identity_changed')
              return now
          
          
          def debugger_script(pid, start, executable, debug_image, udid, service, phase_path=None):
              # Outer verify pins exact simulator/service/PID before launch. Recheck that
              # PID start/executable here; nested simctl stalled before attach on hosted macOS.
              return '\n'.join([
                  'import json, os, time, subprocess',
                  f'result = {{"attached": False, "detached": False, "pid": {pid}}}',
                  f'phase_path = {str(phase_path) if phase_path else None!r}',
                  'checkpoints = []',
                  'clock_start = time.monotonic()',
                  'def checkpoint(stage, complete, code=0):',
                  '    if phase_path is None: return',
                  '    checkpoints.append({"stage": stage, "seconds": time.monotonic() - clock_start,',
                  '                        "complete": complete, "attached": result["attached"],',
                  '                        "detached": result["detached"], "code": int(code)})',
                  '    try:',
                  '        descriptor = os.open(phase_path + ".next", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)',
                  '        with os.fdopen(descriptor, "w") as stream:',
                  '            json.dump(checkpoints, stream, allow_nan=False)',
                  '            stream.flush()',
                  '            os.fsync(stream.fileno())',
                  '        os.replace(phase_path + ".next", phase_path)',
                  '    except OSError:',
                  '        result["checkpoint_write_failed"] = True',
                  'def checked_read(command, label, seconds):',
                  '    checkpoint("read_" + label, False)',
                  '    try:',
                  '        output = subprocess.check_output(command, text=True, timeout=seconds).strip()',
                  '    except subprocess.TimeoutExpired:',
                  '        result["read_error"] = "read_command_timeout_" + label',
                  '        checkpoint("read_" + label, True, 1)',
                  '        raise RuntimeError("read_timeout") from None',
                  '    except subprocess.CalledProcessError:',
                  '        result["read_error"] = "read_command_failed_" + label',
                  '        checkpoint("read_" + label, True, 2)',
                  '        raise RuntimeError("read_failed") from None',
                  '    checkpoint("read_" + label, True)',
                  '    return output',
                  'target = None',
                  'process = None',
                  'stage = "bootstrap"',
                  'try:',
                  '    checkpoint("bootstrap", False)',
                  '    import lldb',
                  '    target = lldb.debugger.CreateTarget("")',
                  '    checkpoint("bootstrap", True)',
                  '    stage = "identity"',
                  '    checkpoint("identity", False)',
                  f'    command = checked_read(["ps", "-p", "{pid}", "-o", "comm="], "ps_exe", 3)',
                  f'    if command != {str(executable)!r}: raise RuntimeError("executable")',
                  f'    current = checked_read(["ps", "-p", "{pid}", "-o", "lstart="], "ps_start", 3)',
                  f'    if current != {start!r}: raise RuntimeError("identity")',
                  '    checkpoint("identity", True)',
                  '    lldb.debugger.SetAsync(False)',
                  '    stage = "attach"',
                  '    error = lldb.SBError()',
                  '    checkpoint("attach", False)',
                  f'    process = target.AttachToProcessWithID(lldb.debugger.GetListener(), {pid}, error)',
                  '    result["attached"] = not error.Fail()',
                  '    checkpoint("attach", True, error.GetError())',
                  '    if error.Fail():',
                  '        result["lldb_error_code"] = error.GetError()',
                  '        raise RuntimeError("attach")',
                  '    stage = "module_identity"',
                  '    checkpoint("module_identity", False)',
                  f'    if process.GetProcessID() != {pid}: raise RuntimeError("pid")',
                  '    from pathlib import Path',
                  f'    if Path(str(target.GetExecutable())).resolve() != Path({str(executable)!r}).resolve(): raise RuntimeError("executable")',
                  f'    modules = [m for m in target.modules if Path(str(m.GetFileSpec())).resolve() == Path({str(debug_image)!r}).resolve()]',
                  '    if len(modules) != 1: raise RuntimeError("debug_image")',
                  '    result["debug_image_uuid"] = modules[0].GetUUIDString()',
                  '    checkpoint("module_identity", True)',
                  '    stage = "main_thread"',
                  '    checkpoint("main_thread", False)',
                  '    threads = [t for t in process if t.GetIndexID() == 1]',
                  '    if len(threads) != 1: raise RuntimeError("main_thread")',
                  '    thread = threads[0]',
                  '    result["thread_id"] = thread.GetThreadID()',
                  '    process.SetSelectedThread(thread)',
                  '    checkpoint("main_thread", True)',
                  '    checkpoint("expression_setup", False)',
                  '    options = lldb.SBExpressionOptions()',
                  '    options.SetLanguage(lldb.eLanguageTypeObjC_plus_plus)',
                  '    options.SetPrefix("#import <UIKit/UIKit.h>\\n#import <objc/runtime.h>\\n@interface NSObject (LecturnInspectionGetters)\\n- (NSString *)text;\\n- (BOOL)hasContextMenu;\\n@end\\n")',
                  f'    options.SetTimeoutInMicroSeconds({EXPR_SECONDS * 1000000})',
                  '    options.SetTryAllThreads(False)',
                  '    options.SetStopOthers(True)',
                  '    options.SetUnwindOnError(True)',
                  '    options.SetIgnoreBreakpoints(True)',
                  '    options.SetTrapExceptions(True)',
                  '    options.SetSuppressPersistentResult(True)',
                  '    checkpoint("expression_setup", True)',
                  '    stage = "expression"',
                  '    checkpoint("compile_or_expression", False)',
                  f'    value = thread.GetFrameAtIndex(0).EvaluateExpression({EXPRESSION!r}, options)',
                  '    checkpoint("compile_or_expression", True, value.GetError().GetError())',
                  '    if value.GetError().Fail():',
                  '        result["lldb_error_code"] = value.GetError().GetError()',
                  '        raise RuntimeError("expression")',
                  '    stage = "read_json"',
                  '    checkpoint("read_json", False)',
                  '    error = lldb.SBError()',
                  '    text = process.ReadCStringFromMemory(value.GetValueAsUnsigned(), 262144, error)',
                  '    if error.Fail(): raise RuntimeError("read_json")',
                  '    result["dump"] = json.loads(text)',
                  '    checkpoint("read_json", True)',
                  'except BaseException as error:',
                  '    result["error"] = {"stage": stage, "type": type(error).__name__}',
                  'finally:',
                  '    checkpoint("detach", False)',
                  '    process = target.GetProcess() if target is not None else None',
                  '    if process is not None and process.IsValid():',
                  '        error = process.Detach()',
                  '        result["detached"] = error.Success()',
                  '        if error.Fail(): result["detach_error_code"] = error.GetError()',
                  '    checkpoint("detach", True, result.get("detach_error_code", 0))',
                  f'    print({MARKER!r} + json.dumps(result), flush=True)',
              ])
          
          
          def parse_dump(output):
              lines = [line[len(MARKER):] for line in output.splitlines() if line.startswith(MARKER)]
              if len(lines) != 1:
                  raise InspectionError('missing_or_ambiguous_debugger_receipt')
              return json.loads(lines[0])
          
          
          def phase_receipt(path):
              if path is None or not path.exists():
                  return {'status': 'not_observed', 'checkpoints': []}
              try:
                  with path.open() as stream:
                      checkpoints = json.loads(stream.read(16385))
                  if not isinstance(checkpoints, list) or not 1 <= len(checkpoints) <= 64:
                      raise ValueError
                  for row in checkpoints:
                      if (not isinstance(row, dict)
                              or set(row) != {'stage', 'seconds', 'complete', 'attached', 'detached', 'code'}
                              or row['stage'] not in PHASES
                              or type(row['seconds']) not in (int, float)
                              or not math.isfinite(row['seconds']) or not 0 <= row['seconds'] <= 3600
                              or any(type(row[key]) is not bool for key in ('complete', 'attached', 'detached'))
                              or type(row['code']) is not int or not 0 <= row['code'] <= 2**64 - 1):
                          raise ValueError
                  return {'status': 'available', 'checkpoints': checkpoints}
              except (OSError, ValueError, TypeError):
                  return {'status': 'invalid_or_unreadable', 'checkpoints': []}
          
          
          def sanitized_sample(path):
              # Emit only literal allowlisted symbols from stack frames, never raw lines.
              symbols = []
              with path.open() as stream:
                  raw = stream.read(524289)
              if len(raw) > 524288:
                  raise InspectionError('sample_output_limit')
              for line in raw.splitlines():
                  if not re.match(r'^\s*[+!:| ]*\d+\s+', line) or ' (in ' not in line:
                      continue
                  for symbol in SAMPLE_SYMBOLS:
                      if re.search(r'(?<![\w:])' + re.escape(symbol) + r'(?=[(<\s])', line):
                          if symbol not in symbols:
                              symbols.append(symbol)
              return symbols
          
          
          def debugger_identity_matches(record):
              if read(['ps', '-p', str(record['pid']), '-o', 'lstart='], 'debugger_start') != record['start']:
                  return False
              executable = read(['ps', '-p', str(record['pid']), '-o', 'comm='], 'debugger_exe')
              if Path(executable).name != 'lldb':
                  return False
              return read(['ps', '-p', str(record['pid']), '-o', 'lstart='], 'debugger_start') == record['start']
          
          
          def sample_debugger(owned, record, purpose, directory):
              result = {'status': 'unavailable', 'symbols': [], 'cleanup_verified': False}
              process = sampler_record = None
              spawn_started = False
              sampler_purpose = purpose + '-timeout-sample'
              raw_path = directory / 'sample.raw'
              try:
                  with bounded(10):
                      if (type(record.get('pid')) is not int or record['pid'] <= 1
                              or not record.get('start') or record.get('purpose') != purpose
                              or record not in owned.records()):
                          result['status'] = 'unsafe_unregistered_debugger'
                          return result
                      if not debugger_identity_matches(record):
                          result['status'] = 'unsafe_debugger_identity_mismatch'
                          return result
                      if not Path('/usr/bin/sample').is_file():
                          result['status'] = 'unavailable_sampler'
                          return result
                      raw_path.touch(mode=0o600)
                      spawn_started = True
                      process = owned.spawn(['/usr/bin/sample', str(record['pid']), '1', '10', '-file', str(raw_path)],
                                            purpose=sampler_purpose, stdin=subprocess.DEVNULL,
                                            stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      sampler_record = next(row for row in owned.records()
                                            if row['pid'] == process.pid and row['purpose'] == sampler_purpose)
                      result['sampler_pid'] = sampler_record['pid']
                      result['sampler_registered'] = True
                      process.communicate(timeout=3)  # Captured noise is deliberately discarded.
                      if not debugger_identity_matches(record):
                          result['status'] = 'unsafe_debugger_identity_changed'
                      elif process.returncode != 0:
                          result['status'] = 'sampler_failed'
                          result['exit_code'] = int(process.returncode)
                      else:
                          result['symbols'] = sanitized_sample(raw_path)
                          result['status'] = 'sampled' if result['symbols'] else 'no_whitelisted_frames'
              except subprocess.TimeoutExpired:
                  result['status'] = 'sampler_timeout'
              except InspectionError as error:
                  result['status'] = 'sampler_deadline' if str(error) == 'deadline' else str(error)
              except (Exception, KeyboardInterrupt):
                  result['status'] = 'sampler_unavailable_or_interrupted'
              finally:
                  try:
                      with bounded(5):
                          if sampler_record is None and spawn_started:
                              sampler_record = next((row for row in owned.records()
                                                     if row['purpose'] == sampler_purpose), None)
                          if sampler_record:
                              stopped = owned.terminate(sampler_record, grace=0.5)
                              if process:
                                  process.wait(timeout=3)
                              if not stopped or owned.group_running(sampler_record['pid']):
                                  raise InspectionError('sampler_group_still_running')
                              result['cleanup_verified'] = True
                          elif process is not None:
                              raise InspectionError('sampler_registration_missing')
                  except (Exception, KeyboardInterrupt):
                      result['cleanup_error'] = 'sampler_cleanup_failed'
                      result['symbols'] = []
                  if process is not None and process.stdout is not None:
                      try:
                          process.stdout.close()
                      except OSError:
                          result['capture_close_error'] = True
                  try:
                      raw_path.unlink(missing_ok=True)
                  except OSError:
                      result['raw_discard_error'] = True
              return result
          
          
          def dump_complete(result):
              if result.get('error') or not result.get('attached') or not result.get('detached'):
                  return False
              dump = result.get('dump', {})
              hosts = dump.get('hosts', [])
              return (not dump.get('native_error') and len(hosts) == 1
                      and hosts[0].get('report_run_count') == 1 and hosts[0].get('filename_count') == 1
                      and hosts[0].get('textview_address') not in (None, '0x0', '(nil)'))
          
          
          def inspect(args, owned):
              receipt = {'accepted': False, 'diagnostic_only': True, 'dump_complete': False,
                         'cleanup_verified': False, 'udid': args.udid, 'bundle_id': BUNDLE,
                         'helper_sha256': sha256(__file__), 'limits_seconds':
                         {'debugger_start_attach_dump': ATTACH_SECONDS, 'expression': EXPR_SECONDS,
                          'discovery': 60, 'debugger_startup': 5, 'read_command': 5,
                          'debugger_cleanup': 5, 'app_cleanup': 25,
                          'timeout_sample': 10, 'sampler_command': 3, 'sampler_cleanup': 5}}
              process = record = identity = None
              directory = phase_path = None
              communicate_started = False
              pid = None
              purpose = 'filechip-native-inspect-' + str(time.time_ns())
              try:
                  with bounded(60):
                      pid, service, identity, container, image_hash = discover(args.udid)
                  receipt['app'] = {'pid': pid, 'start': identity['start'], 'debug_dylib_sha256': image_hash,
                                    'service_sha256': hashlib.sha256(service.encode()).hexdigest()}
                  verify(args.udid, pid, service, identity)
                  directory = Path(tempfile.mkdtemp(prefix='filechip-native-phases-'))
                  phase_path = directory / 'phases.json'
                  script = debugger_script(pid, identity['start'], identity['executable'], container / 'Lecturn.debug.dylib',
                                           args.udid, service, phase_path)
                  with bounded(5):
                      process = owned.spawn(['xcrun', 'lldb', '--no-lldbinit', '--batch', '-o', 'script exec(' + repr(script) + ')'],
                                            purpose=purpose, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                            stderr=subprocess.STDOUT, text=True)
                  record = next(row for row in owned.records() if row['pid'] == process.pid and row['purpose'] == purpose)
                  receipt['debugger'] = {'pid': record['pid'], 'start': record['start'], 'purpose': purpose}
                  communicate_started = True
                  output, _ = process.communicate(timeout=ATTACH_SECONDS)
                  receipt['debugger_exit_code'] = process.returncode
                  receipt['native'] = parse_dump(output)
                  receipt['native_dump_sha256'] = hashlib.sha256(json.dumps(receipt['native'], sort_keys=True).encode()).hexdigest()
                  receipt['dump_complete'] = process.returncode == 0 and dump_complete(receipt['native'])
                  if not receipt['dump_complete']:
                      receipt['error'] = 'native_dump_incomplete_or_ambiguous'
              except (Exception, KeyboardInterrupt) as error:
                  receipt['error'] = str(error) if isinstance(error, InspectionError) else type(error).__name__
                  if isinstance(error, subprocess.TimeoutExpired) and communicate_started:
                      receipt['debugger_outer_timeout'] = True
              finally:
                  # Allow one interrupt to enter cleanup, then finish cleanup before
                  # honoring further termination. SIGALRM still bounds each operation.
                  handlers = {s: signal.signal(s, signal.SIG_IGN) for s in (signal.SIGINT, signal.SIGTERM)}
                  receipt['phases'] = phase_receipt(phase_path)
                  if receipt.get('debugger_outer_timeout'):
                      receipt['phases_at_outer_timeout'] = receipt['phases']
                      receipt['timeout_sample'] = (sample_debugger(owned, record, purpose, directory) if record and directory
                                                   else {'status': 'unsafe_missing_debugger_registration', 'symbols': [],
                                                         'cleanup_verified': False})
                  # A registration failure can still leave a registered launcher. Limit
                  # cleanup to this invocation, never sweep another helper's registry.
                  try:
                      with bounded(5):
                          if record is None:
                              record = next((row for row in owned.records() if row['purpose'] == purpose), None)
                          if record:
                              receipt.setdefault('debugger', {'pid': record['pid'], 'start': record['start'], 'purpose': purpose})
                              receipt['debugger_group_stopped'] = owned.terminate(record, grace=0.5)
                              if process:
                                  process.wait(timeout=3)
                              if not receipt['debugger_group_stopped'] or owned.group_running(record['pid']):
                                  raise InspectionError('debugger_group_still_running')
                  except (Exception, KeyboardInterrupt) as error:
                      receipt['debugger_cleanup_error'] = str(error) if isinstance(error, InspectionError) else type(error).__name__
                      # If graceful group cleanup failed, the registered leader must
                      # still have its recorded identity before a forced group stop.
                      try:
                          with bounded(5):
                              if record and read(['ps', '-p', str(record['pid']), '-o', 'lstart='], 'debugger_start') == record['start']:
                                  os.killpg(record['pid'], signal.SIGKILL)
                                  if process:
                                      process.wait(timeout=3)
                                  receipt['debugger_forced_stop'] = not owned.group_running(record['pid'])
                      except (Exception, KeyboardInterrupt) as recovery_error:
                          receipt['debugger_recovery_error'] = (str(recovery_error) if isinstance(recovery_error, InspectionError)
                                                                 else type(recovery_error).__name__)
                  try:
                      with bounded(25):
                          if pid and identity:
                              now = verify(args.udid, pid, service, identity)
                              if 'T' in now['state']:
                                  # Only the identical launch service, executable and start
                                  # identity may be resumed. Never signal a replacement PID.
                                  os.kill(pid, signal.SIGCONT)
                                  receipt['recovery_sigcont'] = True
                                  now = verify(args.udid, pid, service, identity)
                                  deadline = time.monotonic() + 3
                                  while 'T' in now['state'] and time.monotonic() < deadline:
                                      time.sleep(0.1)
                                      now = verify(args.udid, pid, service, identity)
                              receipt['app_state_after_cleanup'] = now['state']
                              receipt['cleanup_verified'] = ('T' not in now['state'] and 'Z' not in now['state']
                                                             and 'debugger_cleanup_error' not in receipt)
                  except (Exception, KeyboardInterrupt) as error:
                      receipt['cleanup_error'] = str(error) if isinstance(error, InspectionError) else type(error).__name__
                  receipt['dump_complete'] = receipt['dump_complete'] and receipt['cleanup_verified']
                  final_phases = phase_receipt(phase_path)
                  if final_phases['status'] == 'available' or receipt['phases']['status'] != 'available':
                      receipt['phases'] = final_phases
                  if directory is not None:
                      try:
                          shutil.rmtree(directory)
                      except OSError:
                          receipt['diagnostic_temp_discard_error'] = True
                  for number, handler in handlers.items():
                      signal.signal(number, handler)
              return receipt
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('udid')
              parser.add_argument('--automation-lock', required=True, type=Path)
              parser.add_argument('--output', required=True, type=Path)
              args = parser.parse_args()
              if not re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', args.udid):
                  parser.error('An exact simulator UDID is required')
              args.udid = args.udid.upper()
              # Import the existing job ownership helper without touching its source.
              sys.path.insert(0, os.environ['RUNNER_TEMP'])
              import ios_owned_processes as owned
              with args.automation_lock.open('a') as lock:
                  try:
                      fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                  except BlockingIOError:
                      receipt = {'accepted': False, 'diagnostic_only': True, 'dump_complete': False,
                                 'cleanup_verified': False, 'error': 'device_automation_busy', 'udid': args.udid}
                  else:
                      previous = {s: signal.signal(s, interrupted) for s in (signal.SIGALRM, signal.SIGINT, signal.SIGTERM)}
                      try:
                          receipt = inspect(args, owned)
                      finally:
                          signal.setitimer(signal.ITIMER_REAL, 0)
                          for number, handler in previous.items():
                              signal.signal(number, handler)
                  args.output.write_text(json.dumps(receipt, indent=2) + '\n')
                  os.chmod(args.output, 0o600)
              print('Native diagnostic only; never acceptance. ' + str(args.output))
              return 0 if receipt['dump_complete'] else 1
          
          
          if __name__ == '__main__':
              sys.exit(main())
          FILECHIP_NATIVE_INSPECT
          export REUSE8_BACKEND_OBSERVER_REPO="$GITHUB_WORKSPACE"
          export REUSE8_BACKEND_OBSERVER_LOG="$GITHUB_WORKSPACE/artifacts/ios-validation/backend-http.jsonl"
          export NODE_OPTIONS="--import=$RUNNER_TEMP/metro-request-observer.mjs --import=$RUNNER_TEMP/metro-runtime-memo.mjs --import=$RUNNER_TEMP/reuse8-backend-observer.mjs"
          python3 "$RUNNER_TEMP/ios-phase-driver.py" start

      - name: Upload native startup diagnostics before scene gate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-startup-diagnostics
          path: artifacts/ios-validation/
          if-no-files-found: warn
          retention-days: 7

      - name: Complete file-chip interaction scene gate
        if: always()
        timeout-minutes: 52
        run: python3 "$RUNNER_TEMP/ios-phase-driver.py" finish

      - name: Stop remaining owned capture process
        if: always()
        run: python3 "$RUNNER_TEMP/ios-phase-driver.py" cleanup

      - name: Validate App Store Connect assets
        run: node scripts/mobile-showcase.ts --platform ios --device iphone-6.9 --scene thread --appearance light --theme lecturn --validate-only

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-screenshots
          path: artifacts/app-store/screenshots/apple/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain simulator build and provenance
        if: always()
        run: |
          mkdir -p artifacts/ios-validation
          git rev-parse HEAD > artifacts/ios-validation/validation-commit.txt
          git status --porcelain > artifacts/ios-validation/post-prebuild-status.txt
          cp "$RUNNER_TEMP/lecturn-link-fixture.mjs" artifacts/ios-validation/fixture-preload.mjs
          cp "$RUNNER_TEMP/ios-filechip-native-inspect.py" "$RUNNER_TEMP/ios-filechip-interaction.py" "$RUNNER_TEMP/ios-link-scene-assert.py" "$RUNNER_TEMP/reuse8-backend-observer.mjs" "$RUNNER_TEMP/metro-runtime-memo.mjs" "$RUNNER_TEMP/ios-driver-warmup.py" "$RUNNER_TEMP/ios-metro-preflight.py" "$RUNNER_TEMP/ios_owned_processes.py" "$RUNNER_TEMP/ios-native-launch.py" "$RUNNER_TEMP/ios-native-launch.yaml" "$RUNNER_TEMP/ios-runtime-probe.mjs" "$RUNNER_TEMP/ios-phase-driver.py" "$RUNNER_TEMP/ios-startup-diagnostics.py" "$RUNNER_TEMP/metro-request-observer.mjs" "$RUNNER_TEMP/ios-url-probe.swift" artifacts/ios-validation/
          ios_products=apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          if [ -d "$ios_products/Lecturn.app" ]; then
            tar -czf artifacts/ios-validation/Lecturn-simulator.app.tgz -C "$ios_products" Lecturn.app
          fi

      - name: Upload validation diagnostics and reusable app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-link-validation-reuse-diagnostics
          path: artifacts/ios-validation/
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android phone, 7-inch tablet, and 10-inch tablet
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 80 }}
    env:
      LECTURN_SHOWCASE_ANDROID_ABI: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android showcase
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 8
          ram-size: 4096M
          disable-animations: false
          script: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}"

      - name: Validate Google Play assets
        run: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}" --validate-only

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-play-screenshots
          path: artifacts/app-store/screenshots/google-play/
          if-no-files-found: warn
          retention-days: 14
