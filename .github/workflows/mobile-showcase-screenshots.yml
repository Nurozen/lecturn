                          with output.open('rb') as stream:
                              data = stream.read(2 * 1024 * 1024 + 1)
                          if len(data) > 2 * 1024 * 1024:
                              raise GateFailure('Observer receipt exceeds diagnostic bound.')
                          try:
                              diagnostic = json.loads(data)
                              receipt['dump_complete'] = diagnostic.get('dump_complete') is True
                              receipt['reader_cleanup_verified'] = diagnostic.get('cleanup_verified') is True
                              receipt['diagnostic_scope_verified'] = (diagnostic.get('accepted') is False
                                  and diagnostic.get('diagnostic_scope') == self.result['diagnostic_scope'])
                          except (ValueError, AttributeError):
                              raise GateFailure('Invalid observer diagnostic receipt.') from None
                      group_stopped = bool(records) and all(row['pid'] in self.cleaned for row in records)
                      self.observer_cleanup_verified = receipt.get('reader_cleanup_verified', False) and group_stopped
                      receipt['cleanup_verified'] = self.observer_cleanup_verified
                      if (receipt['exit_code'] != 0 or not receipt['dump_complete']
                              or not self.observer_cleanup_verified or not receipt.get('diagnostic_scope_verified')):
                          raise GateFailure('Diagnostic observer read incomplete or cleanup unverified; inspect observer-read.json and cleanup receipts.')
                  finally:
                      self.checkpoint()
          
              def snapshot(self, stage):
                  image = self.path / (stage + '.png')
                  self.command(stage + '-screenshot', ['xcrun', 'simctl', 'io', self.udid, 'screenshot', str(image)])
                  if not image.exists() or image.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                      raise GateFailure('Missing PNG at ' + stage + '; inspect screenshot log.')
                  self.command(stage + '-hierarchy', [str(self.maestro), '--device', self.udid, 'hierarchy'], stage + '-hierarchy.json')
                  raw = (self.path / (stage + '-hierarchy.json')).read_text()
                  try:
                      tree, _ = json.JSONDecoder().raw_decode(raw[raw.index('{'):])
                      if 'attributes' not in tree or 'children' not in tree:
                          raise ValueError()
                  except (ValueError, TypeError):
                      raise GateFailure('Unrecognized Maestro hierarchy at ' + stage + '; inspect retained receipts.') from None
                  reject_error(tree)
