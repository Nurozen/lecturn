              'bHQsIGluZGVudD0yKSArICdcbicpCiAgICB3aXRoIG9wZW4oZW52WydHSVRIVUJfT1VUUFVUJ10sICdhJykgYXMgc3RyZWFtOgog'
              'ICAgICAgIHN0cmVhbS53cml0ZSgnZWxpZ2libGU9JyArIHN0cihyZXN1bHRbJ21hbnVhbFJldmlld0VsaWdpYmxlJ10pLmxvd2Vy'
              'KCkgKyAnXG4nKQoKCmlmIF9fbmFtZV9fID09ICdfX21haW5fXyc6CiAgICBtYWluKCkK'
          )
          assert hashlib.sha256(retention).hexdigest() == 'eb4afb106e51ea2652caeaf8c7f06c92a7ea17a430a10c7975b87160e76cb715'
          (root.parent/'ownership-media-retention.py').write_bytes(retention)
          output=Path(os.environ['RUNNER_TEMP'])/('capture-output-'+os.environ['ARM'])
          output.mkdir()
          (output/'capture-helper-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PYHELPER
          echo "CAPTURE_SOURCE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CAPTURE_OUTPUT=$RUNNER_TEMP/capture-output-$ARM" >> "$GITHUB_ENV"
          echo "CAPTURE_STATE=$RUNNER_TEMP/capture-state-$ARM" >> "$GITHUB_ENV"
          echo "CAPTURE_REVIEW_OUTPUT=$RUNNER_TEMP/capture-review-$ARM" >> "$GITHUB_ENV"
          echo "BUILD_ARCHIVE=$RUNNER_TEMP/build-input/Lecturn-$VARIANT-simulator.app.tgz" >> "$GITHUB_ENV"
      - name: Setup source-pinned dependencies
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...
      - name: Expose pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"
      - name: Reuse immutable build2 AFTER native archive (no app rebuild)
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: Nurozen/lecturn
          run-id: ${{ matrix.BUILD_RUN_ID }}
          name: ${{ matrix.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/build-input
      - name: Verify source, build run, archive, binary and installed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/capture/provenance.py"
      - name: Install pinned task-local native driver
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip' -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/maestro/bin/maestro" --version
      - name: Compile Foundation transport probe for installed runtime
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -parse-as-library -sdk "$sdk" -target arm64-apple-ios26.0-simulator "$RUNNER_TEMP/capture/ios-url-probe.swift" -o "$RUNNER_TEMP/capture/ios-url-probe"
      - name: Capture AFTER ownership diagnostic only (never normal acceptance)
        timeout-minutes: 190
        run: python3 "$RUNNER_TEMP/capture/run.py"
      - name: Stop only registered remaining owned process groups
        id: owned_cleanup
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ios-owned-process-groups.jsonl" ]; then
            python3 -c 'import os,sys; sys.path.insert(0,os.environ["RUNNER_TEMP"]+"/capture"); import ios_owned_processes as p; p.cleanup()'
          fi
      - name: Release sanitized compose-outcome metadata after independent cleanup
        id: compose_outcome_metadata
        if: always()
        env:
          OWNED_CLEANUP_OUTCOME: ${{ steps.owned_cleanup.outcome }}
        run: python3 "$RUNNER_TEMP/capture/compose_outcome.py"
      - name: Validate owned media after all cleanup (private review only)
        id: owned_media
        if: always()
        env:
          OWNED_CLEANUP_OUTCOME: ${{ steps.owned_cleanup.outcome }}
        run: python3 "$RUNNER_TEMP/ownership-media-retention.py"
      - name: Upload diagnostic metadata always (media separate)
        id: diagnostic_metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c10-ownership-diagnostic-${{ matrix.ARM }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-output-${{ matrix.ARM }}/
          if-no-files-found: error
          retention-days: 14
      - name: Retain gated synthetic review media privately
        if: always() && steps.owned_media.outputs.eligible == 'true' && steps.diagnostic_metadata.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: c10-ownership-private-review-${{ matrix.ARM }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-private-retention-${{ matrix.ARM }}/
          if-no-files-found: error
          retention-days: 14
