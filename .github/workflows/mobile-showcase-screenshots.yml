                                     'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                                     'file_mtime_unix_ms': metadata.st_mtime_ns / 1e6,
                                     'unix_ms': time.time() * 1000, 'monotonic_seconds': time.monotonic(),
                                     'identity_verified_after_read': False}
