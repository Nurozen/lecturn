            'EnvironmentAuthInvalidError', 'EnvironmentScopeRequiredError', 'EnvironmentRequestInvalidError',
            'RemoteEnvironmentAuthTimeoutError', 'RemoteEnvironmentAuthFetchError',
            'RemoteEnvironmentAuthInvalidJsonError', 'RemoteEnvironmentAuthUndeclaredStatusError',
            'SchemaError', 'ParseError', 'TypeError', 'ReferenceError', 'SyntaxError'];
          export function classify(value) {
            const text = typeof value === 'string' ? value : '';
