          assert hashlib.sha256(payload).hexdigest() == '4f92245c10336782ce1e999e92b9a5cf20e4a9c11c98f01d3ff59bb701ac3927'
          files=json.loads(payload)
          assert set(files) == set(['disclosure_identity.py', 'disclosure_navigation.py', 'disclosure_targets.py', 'drive.py', 'fixture-probe.mjs', 'fixtures.mjs', 'gateway.mjs', 'geometry.py', 'hierarchy_observation.py', 'ios-url-probe.swift', 'ios_owned_processes.py', 'metro-entry-hook.mjs', 'metro-runtime-memo.mjs', 'motion-summary.mjs', 'native_reuse.py', 'provenance.py', 'retrieve-trace.mjs', 'run.py', 'safety.cjs', 'served-registration.cjs', 'source-roles.json', 'startup_failure.py', 'trace-runtime.js', 'transform.cjs', 'verify-list.mjs'])
          root=Path(os.environ['RUNNER_TEMP'])/'capture'
          assert not root.exists()
          root.mkdir(mode=0o700)
          hashes={}
          for name,encoded in files.items():
              assert Path(name).name==name
              data=base64.b64decode(encoded)
              (root/name).write_bytes(data)
              hashes[name]=hashlib.sha256(data).hexdigest()
          output=Path(os.environ['RUNNER_TEMP'])/'capture-output'
          output.mkdir()
          (output/'capture-helper-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PYHELPER
          echo "CAPTURE_SOURCE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CAPTURE_OUTPUT=$RUNNER_TEMP/capture-output" >> "$GITHUB_ENV"
          echo "CAPTURE_STATE=$RUNNER_TEMP/capture-state" >> "$GITHUB_ENV"
          echo "BUILD_ARCHIVE=$RUNNER_TEMP/build-input/Lecturn-$VARIANT-simulator.app.tgz" >> "$GITHUB_ENV"
      - name: Setup source-pinned dependencies
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...
      - name: Expose pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"
      - name: Download pinned original AFTER native build for strict reuse proof
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: Nurozen/lecturn
          run-id: ${{ matrix.BUILD_RUN_ID }}
          name: ${{ matrix.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/build-input
      - name: Verify source, build run, archive, binary and installed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B "$RUNNER_TEMP/capture/provenance.py"
      - name: Install pinned task-local native driver
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip' -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/maestro/bin/maestro" --version
      - name: Compile Foundation transport probe for installed runtime
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -parse-as-library -sdk "$sdk" -target arm64-apple-ios26.0-simulator "$RUNNER_TEMP/capture/ios-url-probe.swift" -o "$RUNNER_TEMP/capture/ios-url-probe"
      - name: Capture fixed C42 partial natural-history diagnostic
        timeout-minutes: 190
        run: python3 -B "$RUNNER_TEMP/capture/run.py"
      - name: Stop only registered remaining owned process groups
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ios-owned-process-groups.jsonl" ]; then
            python3 -B -c 'import os,sys; sys.path.insert(0,os.environ["RUNNER_TEMP"]+"/capture"); import ios_owned_processes as p; p.cleanup()'
          fi
      - name: Upload curated evidence and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-C42-${{ matrix.CAPTURE_CASE }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-export/
          if-no-files-found: error
          retention-days: 14
