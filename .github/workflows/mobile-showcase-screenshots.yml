name: Mobile Showcase Screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: C30-mvcp-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/validation/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    name: C30 changed MVCP diagnostic ${{ matrix.ARM }}
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - VARIANT: after
            ARM: after-original
            CAPTURE_SCENARIOS: 'ownership'
            SOURCE_COMMIT: '65318f080902a00d1b421ff86755f1a4a75e8b5b'
            SOURCE_TREE: 7874152fdc79ba9ab7112a7bc3717b9d81815c56
            BUILD_RUN_ID: '38680507825'
            BUILD_COMMIT: 'ac51e13f2c0e287fd58261b2c82ffcbea2e98bfa'
            BUILD_ARCHIVE_HASH: 'a52ff786672cddeddd8731b89952300bcbfc06ded4e8712df421973005b83349'
            BUILD_ARTIFACT: ios-after-native-build
          - VARIANT: after
            ARM: after-retain-js
            CAPTURE_SCENARIOS: 'ownership'
            SOURCE_COMMIT: '65318f080902a00d1b421ff86755f1a4a75e8b5b'
            SOURCE_TREE: 7874152fdc79ba9ab7112a7bc3717b9d81815c56
            BUILD_RUN_ID: '38680507825'
            BUILD_COMMIT: 'ac51e13f2c0e287fd58261b2c82ffcbea2e98bfa'
            BUILD_ARCHIVE_HASH: 'a52ff786672cddeddd8731b89952300bcbfc06ded4e8712df421973005b83349'
            BUILD_ARTIFACT: ios-after-native-build
    env:
      ARTIFACT: C30-mvcp-${{ matrix.ARM }}-${{ github.run_id }}-${{ github.run_attempt }}
      VARIANT: ${{ matrix.VARIANT }}
      ARM: ${{ matrix.ARM }}
      BUILD_ARTIFACT: ${{ matrix.BUILD_ARTIFACT }}
      DIAGNOSTIC_PROTOCOL: C30-changed-mvcp-v1
      CAPTURE_SCENARIOS: ${{ matrix.CAPTURE_SCENARIOS }}
      SOURCE_COMMIT: ${{ matrix.SOURCE_COMMIT }}
      SOURCE_TREE: ${{ matrix.SOURCE_TREE }}
      BUILD_RUN_ID: ${{ matrix.BUILD_RUN_ID }}
      BUILD_COMMIT: ${{ matrix.BUILD_COMMIT }}
      BUILD_ARCHIVE_HASH: ${{ matrix.BUILD_ARCHIVE_HASH }}
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Materialize immutable exact public source
        shell: bash
        run: |
          set -euo pipefail
          test "$VARIANT" = after
          case "$ARM" in after-original|after-retain-js) ;; *) exit 1 ;; esac
          test "$DIAGNOSTIC_PROTOCOL" = C30-changed-mvcp-v1
          test "$CAPTURE_SCENARIOS" = ownership
          test "$SOURCE_COMMIT" = 65318f080902a00d1b421ff86755f1a4a75e8b5b
          test "$SOURCE_TREE" = 7874152fdc79ba9ab7112a7bc3717b9d81815c56
          test "$BUILD_ARTIFACT" = ios-after-native-build
          test "$BUILD_RUN_ID" = 38680507825
          test "$BUILD_COMMIT" = ac51e13f2c0e287fd58261b2c82ffcbea2e98bfa
          test "$BUILD_ARCHIVE_HASH" = a52ff786672cddeddd8731b89952300bcbfc06ded4e8712df421973005b83349
          git init .
          git remote add origin https://github.com/Nurozen/lecturn.git
          git config core.sparseCheckout true
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c protocol.file.allow=never -c submodule.recurse=false fetch --no-tags --depth=1 --filter=blob:none origin "$SOURCE_COMMIT"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test ! -e .env
          test ! -e .env.local
          test ! -e apps/mobile/.env
          test ! -e apps/mobile/.env.local
