          assert hashlib.sha256(compressed).hexdigest() == '9484f43b321d69ab7cd77ee31adc157b74d01363ae5e87fccba5e3dd48a3bc9e'
          expected_raw_len=354414
          decoder=zlib.decompressobj()
          payload=decoder.decompress(compressed,expected_raw_len+1)
          assert len(payload) == expected_raw_len
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert hashlib.sha256(payload).hexdigest() == '541136b604ca353dea14a5322b9ecfaa500043af00954f6804c29207f242768c'
          files=json.loads(payload)
          assert set(files) == set(['disclosure_navigation.py', 'disclosure_targets.py', 'drive.py', 'fixture-probe.mjs', 'fixtures.mjs', 'gateway.mjs', 'geometry.py', 'hierarchy_observation.py', 'ios-url-probe.swift', 'ios_owned_processes.py', 'metro-runtime-memo.mjs', 'motion-summary.mjs', 'native_reuse.py', 'provenance.py', 'run.py', 'safety.cjs', 'shared-labels.json', 'shared_driver.py', 'shared_protocol.mjs', 'shared_safety.py', 'shared_states.py', 'startup_failure.py', 'verify-list.mjs'])
