                          with open(os.devnull, 'wb') as log:
                              with self.limit(NATIVE_WORK_SECONDS, work=True) as timeout:
                                  deadline = time.monotonic() + timeout
                                  process = self.start([
                                      sys.executable, str(runner / 'ios-filechip-native-inspect.py'), self.udid,
                                      '--automation-lock', str(runner / ('ios-automation-' + self.udid + '.lock')),
                                      '--output', str(output)], stage, log, subprocess.STDOUT)
                                  receipt['exit_code'] = process.wait(timeout=max(0, deadline-time.monotonic()))
                                  if time.monotonic() >= deadline:
                                      raise CommandDeadline()
