              }
              for (const capture of captures) {
                const pairingHost`);
              replaceOnce("const metroHost = hasIos ? lanIpv4Address() : \"127.0.0.1\";", "const metroHost = \"127.0.0.1\"; // Owned hosted simulator shares host loopback.");
              replaceOnce("[\"exec\", \"expo\", \"start\", \"--dev-client\", \"--port\", String(config.metroPort)]", "[\"exec\", \"expo\", \"start\", \"--dev-client\", \"--scheme\", \"lecturn\", \"--clear\", \"--port\", String(config.metroPort)]");
              replaceOnce("async function warmMetroBundle(\n  platform: ShowcaseDevice[\"platform\"],\n  host: string,\n  config: ShowcaseConfig,\n): Promise<void> {\n  const url = `http://${host}:${config.metroPort}/apps/mobile/index.bundle?platform=${platform}&dev=true&minify=false`;\n  await runCommand(\"curl\", [\"--fail\", \"--silent\", \"--show-error\", \"--output\", \"/dev/null\", url]);\n}\n", "async function warmMetroBundle(\n  platform: ShowcaseDevice[\"platform\"], host: string, config: ShowcaseConfig,\n): Promise<void> {\n  if (platform !== \"ios\") throw new Error(\"This validation fixture is iOS only\");\n  const manifestResponse = await fetch(`http://${host}:${config.metroPort}/?platform=ios`, {\n    headers: { \"expo-platform\": \"ios\", accept: \"application/expo+json\" },\n  });\n  if (!manifestResponse.ok) throw new Error(\"Validation Metro manifest unavailable\");\n  const manifest = await manifestResponse.json() as { launchAsset?: { url?: string } };\n  const asset = manifest.launchAsset?.url;\n  if (!asset) throw new Error(\"Validation Metro manifest has no launch asset\");\n  const bundleUrl = new URL(asset);\n  if (![\"127.0.0.1\", \"localhost\"].includes(bundleUrl.hostname) || bundleUrl.port !== String(config.metroPort)) {\n    throw new Error(\"Validation manifest launch asset is not owned loopback Metro\");\n  }\n  const bundleResponse = await fetch(bundleUrl);\n  if (!bundleResponse.ok) throw new Error(\"Validation launch bundle unavailable\");\n  const bundle = await bundleResponse.text();\n  const serializedFlag = /[\"']EXPO_PUBLIC_SHOWCASE[\"']\\s*:\\s*\\{\\s*enumerable:\\s*true,\\s*value:\\s*[\"']1[\"']\\s*\\}/.test(bundle);\n  const dotenvFiles = (await NodeFSP.readdir(MOBILE_ROOT)).filter((name) => /^\\.env(?:\\.development|\\.local|\\.development\\.local)?$/.test(name));\n  const coordinatorIncluded = bundle.includes(\"SHOWCASE_ENABLED\") && bundle.includes(\"EXPO_PUBLIC_SHOWCASE\");\n  console.log(\"Validation launch asset warm; serialized showcase flag:\", serializedFlag, \"dotenv overrides:\", dotenvFiles.length, \"coordinator included:\", coordinatorIncluded);\n  if (!serializedFlag || dotenvFiles.length !== 0 || !coordinatorIncluded) throw new Error(\"Validation bundle does not prove showcase fixture enabled\");\n}");
              replaceOnce("    ]);\n  };\n  await NodeFSP.rm(readyPath, { force: true });", "    ]);\n    if (pairingUrls.length !== 3) throw new Error(\"Validation requires three synthetic pairing inputs\");\n    console.log(\"Validation native launch arguments supplied: three pairing inputs, scene, theme, orientation.\");\n    await delay(2000);\n    const devClientUrl = \"exp+lecturn://expo-development-client/?url=\" + encodeURIComponent(metroUrl);\n    await runCommand(\"xcrun\", [\"simctl\", \"openurl\", simulator.udid, devClientUrl]);\n    console.log(\"Validation explicit development-client URL opened on owned simulator.\");\n    await delay(45000);\n    const diagnosticDirectory = NodePath.join(REPO_ROOT, \"artifacts/ios-validation\");\n    await NodeFSP.mkdir(diagnosticDirectory, { recursive: true });\n    await runCommand(\"xcrun\", [\"simctl\", \"io\", simulator.udid, \"screenshot\", NodePath.join(diagnosticDirectory, \"post-launch-\" + Date.now() + \".png\")]);\n  };\n  await NodeFSP.rm(readyPath, { force: true });");
              replaceOnce("    await delay(45000);\n    const diagnosticDirectory = NodePath.join(REPO_ROOT, \"artifacts/ios-validation\");", "    await runCommand(\"python3\", [NodePath.join(NodeProcess.env.RUNNER_TEMP!, \"ios-native-launch.py\"), simulator.udid]);\n    await delay(45000);\n    const diagnosticDirectory = NodePath.join(REPO_ROOT, \"artifacts/ios-validation\");\n    await NodeFSP.mkdir(diagnosticDirectory, { recursive: true });\n    await runCommand(NodeProcess.execPath, [NodePath.join(NodeProcess.env.RUNNER_TEMP!, \"ios-runtime-probe.mjs\"), \"8199\", NodePath.join(diagnosticDirectory, \"runtime-probe-\" + Date.now() + \".json\")]);");
              replaceOnce("for (let attempt = 0; attempt < 2; attempt += 1)", "for (let attempt = 0; attempt < 1; attempt += 1)");
              replaceOnce("const isLastAttempt = attempt === 1;", "const isLastAttempt = attempt === 0;");
              replaceOnce("    await runCommand(\"python3\", [NodePath.join(NodeProcess.env.RUNNER_TEMP!, \"ios-native-launch.py\"), simulator.udid]);", "    let nativeDialogFlowFailed = false;\n    await runCommand(\"python3\", [NodePath.join(NodeProcess.env.RUNNER_TEMP!, \"ios-native-launch.py\"), simulator.udid]).catch(() => { nativeDialogFlowFailed = true; console.log(\"Validation native dialog flow failed; retaining startup diagnostics.\"); });");
              replaceOnce("    await runCommand(\"xcrun\", [\"simctl\", \"io\", simulator.udid, \"screenshot\", NodePath.join(diagnosticDirectory, \"post-launch-\" + Date.now() + \".png\")]);", "    await runCommand(\"xcrun\", [\"simctl\", \"io\", simulator.udid, \"screenshot\", NodePath.join(diagnosticDirectory, \"post-launch-\" + Date.now() + \".png\")]);\n    await runCommand(\"python3\", [NodePath.join(NodeProcess.env.RUNNER_TEMP!, \"ios-startup-diagnostics.py\"), simulator.udid]);\n    const diagnosticResult = JSON.parse(await NodeFSP.readFile(NodePath.join(diagnosticDirectory, \"startup-diagnostic-result.json\"), \"utf8\"));\n    await NodeFSP.writeFile(NodePath.join(diagnosticDirectory, \"startup-ready.json\"), JSON.stringify({ nativeLoaderError: diagnosticResult.native_loader_error_copied, nativeDialogFlowFailed, accepted: false }));\n    const phaseDeadline = Date.now() + 300000;\n    while (!(await NodeFSP.access(NodePath.join(diagnosticDirectory, \"startup-release.json\")).then(() => true, () => false))) {\n      if (Date.now() >= phaseDeadline) throw new Error(\"Startup artifact phase release timed out\");\n      await delay(250);\n    }\n    if (diagnosticResult.native_loader_error_copied || nativeDialogFlowFailed) throw new Error(\"Native startup failure captured; scene gate not entered\");");
              console.log("Validation-only harness: post-build warm-up, 300s first-scene deadline, same ready marker, failure screenshots.");
              return { ...result, source };
            },
          });
          import { pathToFileURL } from "node:url";
          import path from "node:path";
          const fixtureUrl = pathToFileURL(path.resolve(process.cwd(), "scripts/mobile-showcase-environment.ts"));
          const { SHOWCASE_THREADS } = await import(fixtureUrl.href);
          SHOWCASE_THREADS[0].response = "Native iOS link rendering fixture\n\n[GitHub repository](https://github.com/Nurozen/lecturn) and [Reference website](https://example.com).\n\nBoth link marks should align with their labels and keep the link text color.";
          console.log("Validation-only fixture: GitHub branded link plus ordinary external link; source files unchanged.");
          FIXTURE
          cat > "$RUNNER_TEMP/ios-runtime-probe.mjs" <<'PROBE'
          // Read only, task-owned Metro CDP. Never returns pairing URLs, tokens or raw exceptions.
          import fs from 'node:fs/promises';
          const port = Number(process.argv[2]);
          const destination = process.argv[3];
          if (port !== 8199 || !destination) throw new Error('Require owned showcase Metro8199 and output file');
          const result = { utc: new Date().toISOString(), targetCount: 0, observations: [] };
          const expression = `(() => { try {
            const m = globalThis.expo?.modules?.LecturnNativeControls;
            let pairingCount = 0, pairingReadable = false;
            try { const raw = m?.getShowcasePairingUrl?.(); const parsed = raw ? JSON.parse(raw) : null;
              pairingReadable = true; pairingCount = Array.isArray(parsed) ? parsed.length : 0; } catch {}
            const scene = m?.getShowcaseScene?.(); const theme = m?.getShowcaseTheme?.();
            return { publicShowcaseEnabled: typeof process !== 'undefined' && process.env?.EXPO_PUBLIC_SHOWCASE === '1',
              nativeControlsAvailable: !!m, pairingReadable, pairingCount,
              threadSceneRequested: scene === 'thread', lecturnThemeRequested: theme === 'lecturn' };
          } catch { return { diagnosticReadFailed: true }; } })()`;
          try {
            const response = await fetch(`http://127.0.0.1:${port}/json/list`, { signal: AbortSignal.timeout(10000) });
            if (!response.ok) throw new Error('Inspector listing unavailable');
            const targets = await response.json();
            result.targetCount = Array.isArray(targets) ? targets.length : 0;
            for (const target of Array.isArray(targets) ? targets : []) {
              if (!target.webSocketDebuggerUrl) continue;
              const url = new URL(target.webSocketDebuggerUrl);
              if (!['127.0.0.1', 'localhost'].includes(url.hostname) || url.port !== String(port)) continue;
              const observation = await new Promise(resolve => {
                const socket = new WebSocket(url);
                let settled = false;
                const finish = value => { if (settled) return; settled = true; clearTimeout(timeout); socket.close(); resolve(value); };
                const timeout = setTimeout(() => finish({ inspectorTimedOut: true }), 10000);
                socket.addEventListener('open', () => socket.send(JSON.stringify({ id: 1, method: 'Runtime.evaluate', params: { expression, returnByValue: true } })));
                socket.addEventListener('message', event => { try { const message = JSON.parse(event.data); if (message.id === 1) finish(message.result?.result?.value ?? { inspectorValueUnavailable: true }); } catch {} });
                socket.addEventListener('error', () => finish({ inspectorUnavailable: true }));
              });
              result.observations.push(observation);
            }
          } catch { result.inspectorListingUnavailable = true; }
          await fs.writeFile(destination, JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          PROBE
          cat > "$RUNNER_TEMP/ios-native-launch.yaml" <<'FLOW'
          appId: com.cloudgatherer.lecturn
          ---
          - extendedWaitUntil:
              visible: 'Open in .*Lecturn.*'
              timeout: 30000
          - tapOn: 'Open'
          - assertNotVisible: 'Open in .*Lecturn.*'
          FLOW
          cat > "$RUNNER_TEMP/ios-native-launch.py" <<'HELPER'
          import os, pathlib, signal, subprocess, sys
          from ios_owned_processes import spawn, terminate_pid
          udid = sys.argv[1]
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          logs = pathlib.Path('artifacts/ios-validation')
          logs.mkdir(parents=True, exist_ok=True)
          with (logs / ('native-launch-' + str(os.getpid()) + '.log')).open('w') as stream:
              try:
                  process = spawn([str(root / 'maestro/bin/maestro'), '--device', udid,
                      'test', '--debug-output', str(logs / ('maestro-' + str(os.getpid()))),
                      str(root / 'ios-native-launch.yaml')], stdout=stream, stderr=subprocess.STDOUT,
                      purpose="native-launch")
                  code = process.wait(timeout=240)
              except subprocess.TimeoutExpired:
                  terminate_pid(process.pid)
                  process.wait()
                  print('Native launch dialog automation timed out; no acceptance.')
                  raise SystemExit(1)
          if code:
              print('Native launch dialog automation failed; retained task-local diagnostics.')
              raise SystemExit(code)
          print('Native launch dialog flow completed; scene acceptance still required.')
          HELPER
          cat > "$RUNNER_TEMP/ios_owned_processes.py" <<'DIAGNOSTIC_0'
          """Job-local process groups registered before commands begin, including orphaned children."""
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time
          import uuid
          
          root = Path(os.environ['RUNNER_TEMP'])
          registry = root / 'ios-owned-process-groups.jsonl'
          
          
          def identity(pid):
              result = subprocess.run(['ps', '-p', str(pid), '-o', 'lstart='],
                  text=True, capture_output=True, check=False)
              return result.stdout.strip() if result.returncode == 0 else None
          
          
          def records():
              if not registry.exists():
                  return []
              with registry.open() as stream:
                  return [json.loads(line) for line in stream if line.strip()]
          
          
          def group_running(pid):
              rows = subprocess.check_output(['ps', '-axo', 'pid=,pgid=,stat='], text=True).splitlines()
              return any(len(fields) >= 3 and int(fields[1]) == pid and not fields[2].startswith('Z')
                         for fields in (row.split() for row in rows))
          
          
          def signal_group(pid, value):
              try:
                  os.killpg(pid, value)
                  return True
              except ProcessLookupError:
                  return False
              except PermissionError:
                  # macOS can report EPERM for a group containing only exited zombies.
                  # Treat only verified non-running groups as gone; live EPERM is an error.
                  if not group_running(pid):
                      return False
                  raise
          
          
          def spawn(command, *, purpose, **kwargs):
              ticket = uuid.uuid4().hex
              kwargs['start_new_session'] = True
              process = subprocess.Popen([sys.executable, __file__, 'launch', ticket, *command], **kwargs)
              record = {'pid': process.pid, 'start': identity(process.pid), 'purpose': purpose}
              if not record['start']:
                  process.wait(timeout=10)
                  raise RuntimeError('Owned command exited before registration')
              # One short O_APPEND write avoids a stopped capture helper holding a file
              # lock while the independent cleanup step reads the ownership registry.
              data = (json.dumps(record) + '\n').encode()
              descriptor = os.open(registry, os.O_WRONLY | os.O_CREAT | os.O_APPEND, 0o600)
              try:
                  if os.write(descriptor, data) != len(data):
                      raise RuntimeError('Incomplete ownership registration')
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)
              (root / ('ios-command-go-' + ticket)).write_text('registered\n')
              return process
          
          
          def terminate(record, grace=5):
              pid = record['pid']
              current = identity(pid)
              if current is not None and current != record['start']:
                  return False  # A live reused PID is never treated as owned.
              if not signal_group(pid, signal.SIGTERM):
                  return True
              # The group remains ours when its original leader exits. Do not use leader
              # liveness as a proxy for surviving children in this recorded process group.
              deadline = time.monotonic() + grace
              while time.monotonic() < deadline:
                  if not group_running(pid):
                      return True
                  time.sleep(0.25)
              signal_group(pid, signal.SIGKILL)
              return True
          
          
          def terminate_pid(pid):
              record = next((record for record in records() if record['pid'] == pid), None)
              if record is None:
                  raise RuntimeError('Refusing to stop an unregistered process group')
              return terminate(record)
          
          
          def cleanup():
              # Freeze the capture group first: its Python helpers cannot launch more
              # commands while cleanup stops registered independent command groups.
              owned = records()
              for record in owned:
                  if record['purpose'] == 'showcase-capture' and identity(record['pid']) == record['start']:
                      signal_group(record['pid'], signal.SIGSTOP)
              owned = records()
              for record in reversed(owned):
                  if record['purpose'] != 'showcase-capture':
                      terminate(record)
              for record in owned:
                  if record['purpose'] == 'showcase-capture':
                      current = identity(record['pid'])
                      if current is not None and current != record['start']:
                          continue
                      # Never resume a launcher after the final registry snapshot: a
                      # paused spawn could otherwise register and release a new group.
                      signal_group(record['pid'], signal.SIGKILL)
          
          
          if __name__ == '__main__':
              if len(sys.argv) < 4 or sys.argv[1] != 'launch':
                  raise SystemExit(2)
              go = root / ('ios-command-go-' + sys.argv[2])
              deadline = time.monotonic() + 10
              while not go.exists() and time.monotonic() < deadline:
                  time.sleep(0.01)
              if not go.exists():
                  raise SystemExit('Unregistered command timed out before execution')
              go.unlink()
              os.execvp(sys.argv[3], sys.argv[3:])
          DIAGNOSTIC_0
          cat > "$RUNNER_TEMP/ios-phase-driver.py" <<'DIAGNOSTIC_1'
          """Own one hosted showcase process and expose startup artifacts before readiness."""
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time
          from ios_owned_processes import spawn, cleanup
          
          temporary = Path(os.environ['RUNNER_TEMP'])
          diagnostics = Path(os.environ['GITHUB_WORKSPACE']) / 'artifacts/ios-validation'
          diagnostics.mkdir(parents=True, exist_ok=True)
          owner_path = diagnostics / 'phase-owner.json'
          completion = diagnostics / 'phase-completion.json'
          ready = diagnostics / 'startup-ready.json'
          release = diagnostics / 'startup-release.json'
          
          
          def atomic(path, value):
              temporary_path = path.with_suffix('.tmp')
              temporary_path.write_text(json.dumps(value, indent=2) + '\n')
              temporary_path.replace(path)
          
          
          def start_identity(pid):
              return subprocess.check_output(['ps', '-p', str(pid), '-o', 'lstart='], text=True).strip()
          
          
          def stop_owned():
              cleanup()
          
          
          mode = sys.argv[1]
          if mode == 'worker':
              with (temporary / 'ios-capture-private.log').open('w') as log:
                  process = spawn(['node', '--import', str(temporary / 'lecturn-link-fixture.mjs'),
                      'scripts/mobile-showcase.ts', '--skip-build', '--platform', 'ios', '--device',
                      'iphone-6.9', '--scene', 'thread', '--appearance', 'light', '--theme', 'lecturn'],
                      stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT, purpose='showcase-capture')
                  atomic(owner_path, {'pid': process.pid, 'start': start_identity(process.pid),
                                      'purpose': 'single owned hosted startup and scene capture'})
                  code = process.wait()
              # Never upload raw logs: fixture output includes fresh synthetic pairing credentials.
              safe_lines = []
              for line in (temporary / 'ios-capture-private.log').read_text(errors='replace').splitlines():
                  if line.startswith(('Validation ', 'Native launch ', 'iOS readiness ', 'Error: iOS showcase')):
                      safe_lines.append(line[:500])
              (diagnostics / 'capture-safe-summary.log').write_text('\n'.join(safe_lines) + '\n')
              atomic(completion, {'exit_code': code, 'utc_epoch': time.time()})
          elif mode == 'start':
              with (temporary / 'ios-phase-worker.log').open('w') as log:
                  subprocess.Popen([sys.executable, __file__, 'worker'], stdin=subprocess.DEVNULL,
                      stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              deadline = time.monotonic() + 900
              while not ready.exists() and not completion.exists() and time.monotonic() < deadline:
                  time.sleep(1)
              if ready.exists():
                  print('Native startup diagnostics complete; scene gate paused for artifact upload.')
              elif completion.exists():
                  print('Capture exited before startup checkpoint; available diagnostics retained.')
                  raise SystemExit(json.loads(completion.read_text())['exit_code'] or 1)
              else:
                  stop_owned()
                  atomic(diagnostics / 'startup-timeout.json', {'timeout_seconds': 900})
                  raise SystemExit(1)
          elif mode == 'finish':
              atomic(release, {'released_after_startup_artifact_step': True})
              deadline = time.monotonic() + 600
              while not completion.exists() and time.monotonic() < deadline:
                  time.sleep(1)
              if not completion.exists():
                  stop_owned()
                  raise SystemExit('Owned scene phase exceeded its bound.')
              raise SystemExit(json.loads(completion.read_text())['exit_code'])
          elif mode == 'cleanup':
              stop_owned()
          else:
              raise SystemExit('Unknown phase')
          DIAGNOSTIC_1
          cat > "$RUNNER_TEMP/ios-startup-diagnostics.py" <<'DIAGNOSTIC_2'
          """Credential-safe reads from the exact hosted task simulator; no host clipboard."""
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import urllib.parse
          from ios_owned_processes import spawn, terminate_pid
          
          udid = sys.argv[1]
          temporary = Path(os.environ['RUNNER_TEMP'])
          diagnostics = Path(os.environ['GITHUB_WORKSPACE']) / 'artifacts/ios-validation'
          diagnostics.mkdir(parents=True, exist_ok=True)
          
          
          def sanitize(text):
              def url(match):
                  value = urllib.parse.urlsplit(match.group())
                  return urllib.parse.urlunsplit((value.scheme, value.netloc.rsplit('@', 1)[-1], value.path, '', ''))
              text = re.sub(r'https?://[^\s<>"\)]+', url, text)
              text = re.sub(r'eyJ[A-Za-z0-9_.-]+', '[redacted]', text)
              return '\n'.join(line for line in text.splitlines()
                  if not re.search(r'token|authorization|showcasePairing', line, re.I))[:200000]
          
          
          def run(name, command, timeout=45, input=None):
              try:
                  process = spawn(command, stdin=subprocess.PIPE if input is not None else subprocess.DEVNULL,
                      text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, purpose='startup-diagnostic')
                  stdout, stderr = process.communicate(input=input, timeout=timeout)
                  result = subprocess.CompletedProcess(command, process.returncode, stdout, stderr)
                  (diagnostics / name).write_text(sanitize(stdout + '\n' + stderr))
                  return result
              except subprocess.TimeoutExpired:
                  terminate_pid(process.pid)
                  process.communicate()
                  (diagnostics / name).write_text('Task-owned diagnostic command timed out.\n')
                  return None
          
          
          subprocess.run(['xcrun', 'simctl', 'pbcopy', udid], input='task-ios-empty-diagnostic', text=True,
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15, check=True)
          flow = temporary / 'ios-copy-loader-error.yaml'
          flow.write_text('''appId: com.cloudgatherer.lecturn
          ---
          - runFlow:
              when:
                visible: 'There was a problem loading the project.'
              commands:
                - tapOn: 'Copy'
          ''')
          run('loader-copy-flow.log', [str(temporary / 'maestro/bin/maestro'), '--device', udid,
              'test', str(flow)], timeout=180)
          copied = run('native-loader-error-sanitized.txt', ['xcrun', 'simctl', 'pbpaste', udid], timeout=15)
          loader_error = bool(copied and 'Failed to load app from' in copied.stdout)
          run('simulator-url-probe.jsonl', ['xcrun', 'simctl', 'spawn', udid,
              str(temporary / 'ios-url-probe'), 'http://127.0.0.1:8199?disableOnboarding=1'], timeout=90)
          run('simulator-native-log-sanitized.txt', ['xcrun', 'simctl', 'spawn', udid, 'log', 'show',
              '--last', '8m', '--style', 'compact', '--predicate', 'process == "Lecturn"'], timeout=30)
          container = subprocess.run(['xcrun', 'simctl', 'get_app_container', udid,
              'com.cloudgatherer.lecturn', 'data'], text=True, capture_output=True, timeout=20, check=False)
          if container.returncode == 0:
              log = Path(container.stdout.strip()) / 'Library/Application Support/dev.expo.modules.core.logging.expo-updates.txt'
              if log.exists():
                  (diagnostics / 'expo-updates-sanitized.txt').write_text(sanitize(log.read_text(errors='replace')))
          (diagnostics / 'startup-diagnostic-result.json').write_text(json.dumps({
              'native_loader_error_copied': loader_error,
              'transport_probe_scope': 'Separate Foundation process in owned simulator; not app ATS/permission identity',
              'accepted': False,
          }, indent=2) + '\n')
          print('Validation startup error/transport diagnostics retained; no acceptance implied.')
          DIAGNOSTIC_2
          cat > "$RUNNER_TEMP/metro-request-observer.mjs" <<'DIAGNOSTIC_3'
          // Session-local observer only; preserves HTTP methods, headers, bodies and responses.
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root = process.env.GITHUB_WORKSPACE;
          const originalEmit = http.Server.prototype.emit;
          if (root) http.Server.prototype.emit = function (...args) {
            const [event, request, response] = args;
            if (event === 'request' && request?.socket?.localPort === 8199 && response) {
              try {
                const started = Date.now();
                const url = new URL(request.url, 'http://127.0.0.1:8199');
                const record = { utc: new Date().toISOString(), method: request.method, path: url.pathname,
                  queryKeys: [...url.searchParams.keys()].filter(k => ['platform', 'disableOnboarding'].includes(k)),
                  headers: {}, clientIdPresent: !!request.headers['expo-dev-client-id'],
                  easClientIdPresent: !!request.headers['eas-client-id'],
                  simulatorFoundationProbe: request.headers['x-lecturn-diagnostic-probe'] === 'simulator-foundation' };
                for (const key of ['accept', 'expo-platform', 'expo-protocol-version', 'expo-api-version',
                  'expo-updates-environment', 'expo-runtime-version']) {
                  if (request.headers[key]) record.headers[key] = String(request.headers[key]).slice(0, 200);
                }
                const chunks = []; let length = 0;
                const collect = chunk => {
                  if (url.pathname !== '/' || !(typeof chunk === 'string' || Buffer.isBuffer(chunk))) return;
                  const data = Buffer.from(chunk); length += data.length;
                  if (length <= 262144) chunks.push(data);
                };
                const write = response.write; const end = response.end;
                response.write = function (...args) { collect(args[0]); return write.apply(this, args); };
                response.end = function (...args) { collect(args[0]); return end.apply(this, args); };
                response.once('finish', () => {
                  try {
                    record.status = response.statusCode; record.elapsedMs = Date.now() - started;
                    record.contentType = String(response.getHeader('content-type') ?? '');
                    record.responseProtocol = String(response.getHeader('expo-protocol-version') ?? '');
                    if (chunks.length && length <= 262144) {
                      const body = Buffer.concat(chunks); record.bodySha256 = crypto.createHash('sha256').update(body).digest('hex');
                      let text = body.toString('utf8');
                      if (record.contentType.startsWith('multipart/')) {
                        const marker = text.indexOf('\r\n\r\n');
                        if (marker >= 0) text = text.slice(marker + 4).split('\r\n--')[0];
                      }
                      try {
                        const manifest = JSON.parse(text);
                        record.manifest = { validJson: true, idPresent: typeof manifest.id === 'string',
                          runtimeMatches: manifest.runtimeVersion === '8e2c93476ba8fc0b3f5cd189fe6d6c767743026e',
                          development: manifest.extra?.expoGo?.packagerOpts?.dev === true,
                          developerTool: manifest.extra?.expoGo?.developer?.tool === 'expo-cli',
                          launchAssetPresent: typeof manifest.launchAsset?.url === 'string' };
                      } catch { record.manifest = { validJson: false }; }
                    }
                    const dir = path.join(root, 'artifacts/ios-validation'); fs.mkdirSync(dir, { recursive: true });
                    fs.appendFileSync(path.join(dir, 'metro-http.jsonl'), JSON.stringify(record) + '\n');
                  } catch {}
                });
              } catch {}
            }
            return originalEmit.apply(this, args);
          };
          DIAGNOSTIC_3
          cat > "$RUNNER_TEMP/ios-url-probe.swift" <<'DIAGNOSTIC_4'
          import Foundation
          import CryptoKit
          
          @main struct NativeURLProbe {
            static func main() async {
              let allowed = "http://127.0.0.1:8199?disableOnboarding=1"
              guard CommandLine.arguments.count == 2, CommandLine.arguments[1] == allowed,
                    let url = URL(string: allowed) else { exit(2) }
              for method in ["HEAD", "GET"] {
                var request = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData,
                                         timeoutInterval: method == "HEAD" ? 10 : 60)
                request.httpMethod = method
                request.setValue("simulator-foundation", forHTTPHeaderField: "X-Lecturn-Diagnostic-Probe")
                request.setValue("ios", forHTTPHeaderField: "Expo-Platform")
                request.setValue(method == "HEAD" ? "application/expo+json,application/json" :
                  "multipart/mixed,application/expo+json,application/json", forHTTPHeaderField: "Accept")
                if method == "GET" {
                  for (key, value) in ["Expo-Protocol-Version": "1", "Expo-API-Version": "1",
                    "Expo-Updates-Environment": "DEVELOPMENT", "Expo-JSON-Error": "true",
                    "Expo-Runtime-Version": "8e2c93476ba8fc0b3f5cd189fe6d6c767743026e"] {
                    request.setValue(value, forHTTPHeaderField: key)
                  }
                }
                let start = Date()
                var result: [String: Any] = ["method": method, "probe": "owned-simulator-Foundation"]
                do {
                  let (data, response) = try await URLSession.shared.data(for: request)
                  if let http = response as? HTTPURLResponse {
                    result["status"] = http.statusCode
                    result["contentType"] = http.value(forHTTPHeaderField: "Content-Type") ?? ""
                    result["protocol"] = http.value(forHTTPHeaderField: "expo-protocol-version") ?? ""
                  }
                  result["bytes"] = data.count
                  result["sha256"] = SHA256.hash(data: data).map { String(format: "%02x", $0) }.joined()
                } catch {
                  let error = error as NSError
                  result["errorDomain"] = error.domain
                  result["errorCode"] = error.code
                }
                result["seconds"] = Date().timeIntervalSince(start)
                if let data = try? JSONSerialization.data(withJSONObject: result, options: [.sortedKeys]),
                   let output = String(data: data, encoding: .utf8) { print(output) }
              }
            }
          }
          DIAGNOSTIC_4
          xcrun --sdk iphonesimulator swiftc -parse-as-library -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios18.0-simulator "$RUNNER_TEMP/ios-url-probe.swift" -o "$RUNNER_TEMP/ios-url-probe"
          codesign --force --sign - "$RUNNER_TEMP/ios-url-probe"
          export NODE_OPTIONS="--import=$RUNNER_TEMP/metro-request-observer.mjs"
          python3 "$RUNNER_TEMP/ios-phase-driver.py" start

      - name: Upload native startup diagnostics before scene gate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-startup-diagnostics
          path: artifacts/ios-validation/
          if-no-files-found: warn
          retention-days: 7

      - name: Complete single iOS scene gate
        if: always()
        timeout-minutes: 12
        run: python3 "$RUNNER_TEMP/ios-phase-driver.py" finish

      - name: Stop remaining owned capture process
        if: always()
        run: python3 "$RUNNER_TEMP/ios-phase-driver.py" cleanup

      - name: Validate App Store Connect assets
        run: node scripts/mobile-showcase.ts --platform ios --device iphone-6.9 --scene thread --appearance light --theme lecturn --validate-only

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-screenshots
          path: artifacts/app-store/screenshots/apple/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain simulator build and provenance
        if: always()
        run: |
          mkdir -p artifacts/ios-validation
          git rev-parse HEAD > artifacts/ios-validation/validation-commit.txt
          git status --porcelain > artifacts/ios-validation/post-prebuild-status.txt
          cp "$RUNNER_TEMP/lecturn-link-fixture.mjs" artifacts/ios-validation/fixture-preload.mjs
          cp "$RUNNER_TEMP/ios_owned_processes.py" "$RUNNER_TEMP/ios-native-launch.py" "$RUNNER_TEMP/ios-native-launch.yaml" "$RUNNER_TEMP/ios-runtime-probe.mjs" "$RUNNER_TEMP/ios-phase-driver.py" "$RUNNER_TEMP/ios-startup-diagnostics.py" "$RUNNER_TEMP/metro-request-observer.mjs" "$RUNNER_TEMP/ios-url-probe.swift" artifacts/ios-validation/
          ios_products=apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          if [ -d "$ios_products/Lecturn.app" ]; then
            tar -czf artifacts/ios-validation/Lecturn-simulator.app.tgz -C "$ios_products" Lecturn.app
          fi

      - name: Upload validation diagnostics and reusable app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-link-validation-reuse-diagnostics
          path: artifacts/ios-validation/
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android phone, 7-inch tablet, and 10-inch tablet
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 60 }}
    env:
      LECTURN_SHOWCASE_ANDROID_ABI: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android showcase
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 8
          ram-size: 4096M
          disable-animations: false
          script: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}"

      - name: Validate Google Play assets
        run: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}" --validate-only

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-play-screenshots
          path: artifacts/app-store/screenshots/google-play/
          if-no-files-found: warn
          retention-days: 14
