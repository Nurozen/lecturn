                  rows = [line.split() for line in raw.splitlines()]
                  matches = [row for row in rows if len(row) == 3 and pattern.fullmatch(row[2])]
                  if len(matches) != 1 or not matches[0][0].isdigit() or int(matches[0][0]) <= 1:
                      raise CaptureError('app_service_missing_or_ambiguous')
