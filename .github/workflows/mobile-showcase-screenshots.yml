                  executable = self.read(['ps', '-p', str(pid), '-o', 'comm='], 'ps_executable')
                  state = self.read(['ps', '-p', str(pid), '-o', 'stat='], 'ps_state')
                  again = self.read(['ps', '-p', str(pid), '-o', 'lstart='], 'ps_start_confirm')
                  if not start or start != again or not executable or not state or any(s in state for s in 'TZ'):
                      raise CaptureError('app_identity_missing_changed_or_stopped')
