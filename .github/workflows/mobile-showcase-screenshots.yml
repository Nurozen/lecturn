              booleans = {'diagnostic_only', 'hidden', 'menu_delegate_selector', 'hasContextMenu',
                          'link_present', 'in_report_run', 'object_replacement_character'}
              arrays = {'hosts', 'runs', 'filename_ranges', 'filename_links', 'attachments'}
              objects = {'range', 'effective_range', 'report_run_range'}
