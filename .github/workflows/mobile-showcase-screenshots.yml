          assert set(files) == set(['disclosure_navigation.py', 'disclosure_targets.py', 'drive.py', 'fixture-probe.mjs', 'fixtures.mjs', 'gateway.mjs', 'geometry.py', 'hierarchy_observation.py', 'ios-url-probe.swift', 'ios_owned_processes.py', 'metro-runtime-memo.mjs', 'motion-summary.mjs', 'native_reuse.py', 'provenance.py', 'run.py', 'safety.cjs', 'startup_failure.py', 'verify-list.mjs'])
