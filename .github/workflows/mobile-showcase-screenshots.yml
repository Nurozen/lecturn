                  self.udid, self.phase = udid, phase
                  self.started = time.monotonic()
                  self.prefix = 'filechip-' + phase + '-' + str(time.time_ns())
                  self.path = Path(os.environ['GITHUB_WORKSPACE']) / 'artifacts/ios-validation' / self.prefix
                  self.path.mkdir(parents=True, mode=0o700)
                  self.maestro = Path(os.environ['RUNNER_TEMP']) / 'maestro/bin/maestro'
                  self.groups, self.cleaned = {}, set()
                  self.recorder = None
                  self.result = {'phase': phase, 'passed': False, 'accepted': False,
                                 'visual_review_required': True, 'limits_seconds': {'total': TOTAL_SECONDS, 'work': WORK_SECONDS, 'action': ACTION_SECONDS, 'maestro_command': MAESTRO_SECONDS, 'visibility': VISIBILITY_MS / 1000},
                                 'stages': [], 'cleanup': [], 'assertions_complete': False}
                  self.checkpoint()
          
              def checkpoint(self):
                  temporary = self.path / 'receipt.tmp'
                  temporary.write_text(json.dumps(self.result, indent=2) + '\n')
                  temporary.replace(self.path / 'receipt.json')
          
              @contextmanager
              def limit(self, seconds, work=False):
                  remaining = (WORK_SECONDS if work else TOTAL_SECONDS) - (time.monotonic()-self.started)
                  if remaining <= 0:
                      raise CommandDeadline()
                  signal.setitimer(signal.ITIMER_REAL, min(seconds, remaining))
                  try:
                      yield min(seconds, remaining)
                  finally:
                      remaining = TOTAL_SECONDS - (time.monotonic()-self.started)
                      signal.setitimer(signal.ITIMER_REAL, max(0, remaining))
          
              def start(self, command, stage, stdout, stderr):
                  purpose = self.prefix + '-' + stage
                  try:
                      return owned.spawn(command, purpose=purpose, stdin=subprocess.DEVNULL,
                                         stdout=stdout, stderr=stderr, cwd=self.path)
                  finally:
                      # Includes a launcher registered before spawn raised; never sweep the job registry.
                      self.groups.update({row['pid']: row for row in owned.records() if row['purpose'].startswith(self.prefix + '-')})
          
              def stop(self, record):
                  if record['pid'] in self.cleaned:
                      return
                  receipt = {'purpose': record['purpose'].removeprefix(self.prefix + '-'), 'stopped': False}
                  self.result['cleanup'].append(receipt)
                  try:
                      with self.limit(2):
                          stopped = owned.terminate(record, grace=0.5)
                          if stopped:
                              while owned.group_running(record['pid']):
                                  time.sleep(0.05)
                              receipt['stopped'] = True
                      if receipt['stopped']:
                          self.cleaned.add(record['pid'])
                  except Exception as error:
                      receipt['error_type'] = type(error).__name__
          
              def command(self, stage, command, output=None):
                  receipt = {'stage': stage, 'exit_code': None, 'timed_out': False}
                  self.result['stages'].append(receipt)
                  process = None
                  began = time.monotonic()
                  with (self.path / (stage + '.log')).open('wb') as log:
                      with (self.path / output).open('wb') if output else open(os.devnull, 'wb') as out:
                          try:
                              with self.limit(MAESTRO_SECONDS if command[0] == str(self.maestro) else ACTION_SECONDS, work=True) as timeout:
                                  process = self.start(command, stage, out if output else log, log if output else subprocess.STDOUT)
                                  receipt['exit_code'] = process.wait(timeout=timeout)
                          except (CommandDeadline, subprocess.TimeoutExpired):
                              receipt['timed_out'] = True
                              raise GateFailure('Deadline at ' + stage + '; inspect retained diagnostics.') from None
                          except Exception as error:
                              receipt['error_type'] = type(error).__name__
                              raise
                          finally:
                              receipt['elapsed_seconds'] = round(time.monotonic()-began, 3)
                              try:
                                  if process:
                                      self.stop(self.groups[process.pid])
                                      if process.pid in self.cleaned:
                                          with self.limit(1):
                                              process.wait(timeout=1)
                              finally:
                                  self.checkpoint()
                  if not self.result['cleanup'][-1]['stopped']:
                      raise GateFailure('Owned action group did not stop; refusing another device command.')
                  if receipt['exit_code'] != 0:
                      raise GateFailure('Command failed at ' + stage + '; inspect retained diagnostics.')
          
              def flow(self, stage, body):
                  flow = self.path / (stage + '.yaml')
                  flow.write_text('appId: com.cloudgatherer.lecturn\n---\n' + body)
                  self.command(stage, [str(self.maestro), '--device', self.udid, 'test', '--debug-output', str(self.path / (stage + '-debug')), str(flow)])
          
              def snapshot(self, stage):
                  image = self.path / (stage + '.png')
                  self.command(stage + '-screenshot', ['xcrun', 'simctl', 'io', self.udid, 'screenshot', str(image)])
                  if not image.exists() or image.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                      raise GateFailure('Missing PNG at ' + stage + '; inspect screenshot log.')
                  self.command(stage + '-hierarchy', [str(self.maestro), '--device', self.udid, 'hierarchy'], stage + '-hierarchy.json')
                  raw = (self.path / (stage + '-hierarchy.json')).read_text()
                  try:
                      tree, _ = json.JSONDecoder().raw_decode(raw[raw.index('{'):])
                      if 'attributes' not in tree or 'children' not in tree:
                          raise ValueError()
                  except (ValueError, TypeError):
                      raise GateFailure('Unrecognized Maestro hierarchy at ' + stage + '; inspect retained receipts.') from None
                  reject_error(tree)
                  return tree
          
              def record(self):
                  self.video_log = (self.path / 'recording.log').open('wb')
                  with self.limit(ACTION_SECONDS, work=True):
                      self.recorder = self.start(['xcrun', 'simctl', 'io', self.udid, 'recordVideo', '--codec=h264', str(self.path / 'interaction.mp4')], 'recording', self.video_log, subprocess.STDOUT)
                  if self.recorder.poll() is not None:
                      raise GateFailure('Recorder exited before interaction; inspect recording log.')
          
              def finalize(self):
                  receipt = self.result['recording'] = {'sigint_sent': False, 'finalized': False}
                  try:
                      if self.recorder:
                          with self.limit(8) as timeout:
                              record = self.groups[self.recorder.pid]
                              current = owned.identity(record['pid'])
                              if current is not None and current != record['start']:
                                  raise GateFailure('Recorder PID identity changed.')
                              receipt['sigint_sent'] = owned.signal_group(record['pid'], signal.SIGINT)
                              receipt['exit_code'] = self.recorder.wait(timeout=timeout)
                              video = self.path / 'interaction.mp4'
                              if video.exists():
                                  with video.open('rb') as stream:
                                      receipt['finalized'] = receipt['sigint_sent'] and receipt['exit_code'] == 0 and video.stat().st_size > 32 and b'ftyp' in stream.read(32)
                  except Exception as error:
                      receipt['error_type'] = type(error).__name__
                  finally:
                      for record in reversed(list(self.groups.values())):
                          self.stop(record)
                      if hasattr(self, 'video_log'):
                          self.video_log.close()
          
              def interact(self):
                  self.command('version', [str(self.maestro), '--version'], 'version.txt')
                  if (self.path / 'version.txt').read_text().strip() != '2.11.0':
                      raise GateFailure('Expected pinned RUNNER_TEMP Maestro 2.11.0; no interaction attempted.')
                  initial = self.snapshot('initial')
                  target = filename_target(initial)
                  if any(matching(initial, text) for text in (*MENU, SHARE, *ACTIVITIES)):
                      raise GateFailure('Initial scene already has menu/activity controls; restore the ready thread before invoking.')
                  anchor = thread_anchor(initial)
                  label = filename_label(target)
                  x, y, right, bottom = bounds(target)
                  point = f'{(x+right)//2},{(y+bottom)//2}'
                  self.result['target'] = {'method': 'observed-compact-filename-leaf-point', 'label': label,
                                           'bounds': bounds(target), 'point': point, 'thread_anchor': anchor}
                  self.record()
                  body = visible(label) + '- longPressOn:\n    point: ' + json.dumps(point) + '\n'
                  body += f'- extendedWaitUntil:\n    visible: "Copy full path"\n    timeout: {VISIBILITY_MS}\n'
                  body += ''.join(visible(text) for text in MENU) + (absent(SHARE) if self.phase == 'before' else visible(SHARE))
                  body += '- takeScreenshot: menu\n'
                  self.flow('menu', body)
                  menu = self.snapshot('menu')
                  for text in MENU:
                      unique_control(menu, text)
                  if self.phase == 'before':
                      if matching(menu, SHARE):
                          raise GateFailure('Baseline unexpectedly contains Save or share.')
                      control = next((text for text in ('Cancel', 'Close') if len(matching(menu, text)) == 1), None)
                      if control:
                          unique_control(menu, control)
                          dismiss = '- tapOn: ' + selector(control) + '\n'
                          self.result['dismissal'] = {'method': 'observed-menu-control', 'label': control}
                      else:
                          point = menu_backdrop(menu)
                          dismiss = '- tapOn:\n    point: ' + json.dumps(point) + '\n'
                          self.result['dismissal'] = {'method': 'observed-outside-menu-tap', 'point': point, 'evidence': 'menu.png + menu-hierarchy.json'}
                      sheet_controls = ()
                  else:
                      unique_control(menu, SHARE)
                      self.flow('share', f'- tapOn: "Save or share"\n- extendedWaitUntil:\n    visible: "Save to Files"\n    timeout: {VISIBILITY_MS}\n' + absent(ERROR) + '- takeScreenshot: sheet\n')
                      sheet = self.snapshot('sheet')
                      if any(matching(sheet, text) for text in (*MENU, SHARE)):
                          raise GateFailure('Menu remains after Save or share; native activity sheet unverified.')
                      sheet_filename = filename_target(sheet, normalize=False)
                      sheet_controls = tuple(text for text in ACTIVITIES if len(matching(sheet, text)) == 1)
                      if 'Save to Files' not in sheet_controls or len(sheet_controls) < 2:
                          raise GateFailure('Sheet lacks report.pdf plus multiple native activity controls; inspect sheet receipts.')
                      for text in sheet_controls:
                          unique_control(sheet, text)
                      control = dismiss_control(sheet)
                      evidence = [sheet_filename, unique_control(sheet, control)] + [unique_control(sheet, text) for text in sheet_controls]
                      containers = [node for node in nodes(sheet) if node is not sheet and all(any(child is item for child in nodes(node)) for item in evidence)]
                      if not containers or bounds(containers[-1]) == screen_bounds(sheet):
                          raise GateFailure('Filename/native controls do not share an observed sheet region; background filename alone is insufficient. Inspect sheet receipts.')
                      self.result['sheet'] = {'filename': FILENAME, 'label': filename_label(sheet_filename), 'filename_bounds': bounds(sheet_filename),
                                              'native_controls': sheet_controls, 'dismiss_control': control, 'bounds': bounds(containers[-1])}
                      self.result['dismissal'] = {'method': 'observed-sheet-control', 'label': control, 'evidence': 'sheet.png + sheet-hierarchy.json'}
                      dismiss = '- tapOn: ' + selector(control) + '\n'
                  dismiss += '- extendedWaitUntil:\n    visible: ' + selector(anchor) + f'\n    timeout: {VISIBILITY_MS}\n' + visible(label)
                  gone = (*MENU, SHARE, ERROR, *sheet_controls, *((control,) if control else ()))
                  dismiss += ''.join(absent(text) for text in gone) + '- takeScreenshot: returned\n'
                  self.flow('dismiss', dismiss)
                  returned = self.snapshot('returned')
                  filename_target(returned)
                  if not matching(returned, anchor) or any(matching(returned, text) for text in (*gone, *ACTIVITIES)):
                      raise GateFailure('Original thread/menu/sheet dismissal not verified; inspect returned receipts.')
                  self.result['assertions_complete'] = True
          
              def run(self):
                  try:
                      self.interact()
                  except (Exception, KeyboardInterrupt) as error:
                      self.result['failure'] = str(error) if isinstance(error, GateFailure) else 'Interrupted at current stage: ' + type(error).__name__
                      # Only after the action group stopped; no competing navigation/driver.
                      if all(row['pid'] in self.cleaned for row in self.groups.values() if row['purpose'] != self.prefix + '-recording'):
                          try:
                              self.snapshot('failure')
                          except Exception as diagnostic_error:
                              self.result['failure_diagnostics_error'] = type(diagnostic_error).__name__
                  finally:
                      try:
                          self.finalize()
                          self.checkpoint()
                          self.result['sha256'] = {}
                          redact_diagnostics(self.path)
                          for path in sorted(self.path.rglob('*')):
                              if path.is_file() and path.name != 'receipt.json':
                                  digest = hashlib.sha256()
                                  with path.open('rb') as stream:
                                      for chunk in iter(lambda: stream.read(1024*1024), b''):
                                          digest.update(chunk)
                                  self.result['sha256'][str(path.relative_to(self.path))] = digest.hexdigest()
                          self.result['sha256']['helper'] = hashlib.sha256(Path(__file__).read_bytes()).hexdigest()
                          self.result['passed'] = 'failure' not in self.result and self.result['assertions_complete'] and self.result['recording']['finalized'] and all(row['stopped'] for row in self.result['cleanup'])
                          if not self.result['passed'] and 'failure' not in self.result:
                              self.result['failure'] = 'Recorder finalization or owned cleanup failed; inspect recording/cleanup receipts.'
                      except Exception as error:
                          self.result['passed'] = False
                          self.result['diagnostics_error'] = type(error).__name__
                          self.result.setdefault('failure', 'Final diagnostics/deadline failure; inspect retained stages and ownership registry.')
                      finally:
                          self.result['elapsed_seconds'] = round(time.monotonic()-self.started, 3)
                          self.checkpoint()
                  return self.result['passed']
          
          
          def main():
              if len(sys.argv) != 3 or sys.argv[2] not in ('before', 'after') or not re.fullmatch(r'[0-9A-Fa-f-]{36}', sys.argv[1]):
                  raise SystemExit('Usage: ios-filechip-interaction.py UDID before|after')
              def interrupted(signum, frame):
                  raise CommandDeadline()
              previous = {number: signal.signal(number, interrupted) for number in (signal.SIGALRM, signal.SIGTERM)}
              helper = Interaction(*sys.argv[1:])
              try:
                  with helper.limit(TOTAL_SECONDS):
                      passed = helper.run()
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  for number, handler in previous.items():
                      signal.signal(number, handler)
              print(('Assertions passed; visual review required. ' if passed else 'Assertions failed; inspect retained diagnostics. ') + str(helper.path / 'receipt.json'))
              return 0 if passed else 1
          
          
          if __name__ == '__main__':
              sys.exit(main())
          FILECHIP_INTERACTION
          export REUSE8_BACKEND_OBSERVER_REPO="$GITHUB_WORKSPACE"
          export REUSE8_BACKEND_OBSERVER_LOG="$GITHUB_WORKSPACE/artifacts/ios-validation/backend-http.jsonl"
          export NODE_OPTIONS="--import=$RUNNER_TEMP/metro-request-observer.mjs --import=$RUNNER_TEMP/metro-runtime-memo.mjs --import=$RUNNER_TEMP/reuse8-backend-observer.mjs"
          python3 "$RUNNER_TEMP/ios-phase-driver.py" start

      - name: Upload native startup diagnostics before scene gate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-startup-diagnostics
          path: artifacts/ios-validation/
          if-no-files-found: warn
          retention-days: 7

      - name: Complete file-chip interaction scene gate
        if: always()
        timeout-minutes: 47
        run: python3 "$RUNNER_TEMP/ios-phase-driver.py" finish

      - name: Stop remaining owned capture process
        if: always()
        run: python3 "$RUNNER_TEMP/ios-phase-driver.py" cleanup

      - name: Validate App Store Connect assets
        run: node scripts/mobile-showcase.ts --platform ios --device iphone-6.9 --scene thread --appearance light --theme lecturn --validate-only

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-screenshots
          path: artifacts/app-store/screenshots/apple/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain simulator build and provenance
        if: always()
        run: |
          mkdir -p artifacts/ios-validation
          git rev-parse HEAD > artifacts/ios-validation/validation-commit.txt
          git status --porcelain > artifacts/ios-validation/post-prebuild-status.txt
          cp "$RUNNER_TEMP/lecturn-link-fixture.mjs" artifacts/ios-validation/fixture-preload.mjs
          cp "$RUNNER_TEMP/ios-filechip-interaction.py" "$RUNNER_TEMP/ios-link-scene-assert.py" "$RUNNER_TEMP/reuse8-backend-observer.mjs" "$RUNNER_TEMP/metro-runtime-memo.mjs" "$RUNNER_TEMP/ios-driver-warmup.py" "$RUNNER_TEMP/ios-metro-preflight.py" "$RUNNER_TEMP/ios_owned_processes.py" "$RUNNER_TEMP/ios-native-launch.py" "$RUNNER_TEMP/ios-native-launch.yaml" "$RUNNER_TEMP/ios-runtime-probe.mjs" "$RUNNER_TEMP/ios-phase-driver.py" "$RUNNER_TEMP/ios-startup-diagnostics.py" "$RUNNER_TEMP/metro-request-observer.mjs" "$RUNNER_TEMP/ios-url-probe.swift" artifacts/ios-validation/
          ios_products=apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          if [ -d "$ios_products/Lecturn.app" ]; then
            tar -czf artifacts/ios-validation/Lecturn-simulator.app.tgz -C "$ios_products" Lecturn.app
          fi

      - name: Upload validation diagnostics and reusable app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-link-validation-reuse-diagnostics
          path: artifacts/ios-validation/
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android phone, 7-inch tablet, and 10-inch tablet
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 80 }}
    env:
      LECTURN_SHOWCASE_ANDROID_ABI: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android showcase
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 8
          ram-size: 4096M
          disable-animations: false
          script: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}"

      - name: Validate Google Play assets
        run: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}" --validate-only

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-play-screenshots
          path: artifacts/app-store/screenshots/google-play/
          if-no-files-found: warn
          retention-days: 14
