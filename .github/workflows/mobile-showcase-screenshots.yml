        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...
      - name: Expose pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"
      - name: Download pinned original AFTER native build for strict reuse proof
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: Nurozen/lecturn
          run-id: ${{ matrix.BUILD_RUN_ID }}
          name: ${{ matrix.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/build-input
      - name: Verify source, build run, archive, binary and installed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/capture/provenance.py"
      - name: Install pinned task-local native driver
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip' -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/maestro/bin/maestro" --version
      - name: Compile Foundation transport probe for installed runtime
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -parse-as-library -sdk "$sdk" -target arm64-apple-ios26.0-simulator "$RUNNER_TEMP/capture/ios-url-probe.swift" -o "$RUNNER_TEMP/capture/ios-url-probe"
      - name: Capture fixed C41 normal shared host case
        timeout-minutes: 190
        run: python3 "$RUNNER_TEMP/capture/run.py"
      - name: Stop only registered remaining owned process groups
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ios-owned-process-groups.jsonl" ]; then
            python3 -c 'import os,sys; sys.path.insert(0,os.environ["RUNNER_TEMP"]+"/capture"); import ios_owned_processes as p; p.cleanup()'
          fi
      - name: Upload curated evidence and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-C41-${{ matrix.CAPTURE_CASE }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-output/
          if-no-files-found: error
          retention-days: 14
