          assert len(compressed) == 78760
          assert hashlib.sha256(compressed).hexdigest() == '77b2bcd169a23191b68787df805dd34567578dee8143861dce4e0c2e4835f434'
          expected_raw_len=225691
          decoder=zlib.decompressobj()
          payload=decoder.decompress(compressed,expected_raw_len+1)
          assert len(payload) == expected_raw_len
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert hashlib.sha256(payload).hexdigest() == '76030783e7e4be4e46e90f033d9a140d17ea05a72e152a7ec728513c3eb539a1'
          files=json.loads(payload)
          assert set(files) == set(['disclosure_navigation.py', 'disclosure_targets.py', 'drive.py', 'fixture-probe.mjs', 'fixtures.mjs', 'gateway.mjs', 'geometry.py', 'hierarchy_observation.py', 'ios-url-probe.swift', 'ios_owned_processes.py', 'metro-runtime-memo.mjs', 'motion-summary.mjs', 'native_reuse.py', 'provenance.py', 'run.py', 'safety.cjs', 'startup_failure.py', 'verify-list.mjs'])
