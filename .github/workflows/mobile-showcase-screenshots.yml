          """Diagnostic interaction copy with a passive app-owned observer read."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import sys
          import time
          from contextlib import contextmanager
          
          import ios_owned_processes as owned
          
          # Eight Maestro invocations on the after path, plus bounded failure capture.
          TOTAL_SECONDS = 2100
          WORK_SECONDS = 2040
          OUTER_SECONDS = 2700
          OBSERVER_SECONDS = 230
          ACTION_SECONDS = 30
          # Includes CLI startup and teardown; hierarchy teardown exceeded 100s hosted.
          MAESTRO_SECONDS = 180
          CLEANUP_SECONDS = 10
          TERM_GRACE_SECONDS = 0.5
          RECORDER_SECONDS = 30
          DIAGNOSTICS_SECONDS = 10
          # The 60s work reserve covers recorder finalization, two pending group stops,
          # and diagnostics. Successful command groups are stopped/reaped immediately.
          VISIBILITY_MS = 10000
          FILENAME = 'report.pdf'
          MENU = ('Copy full path', 'Copy relative path', 'Open in file viewer')
          SHARE = 'Save or share'
          ACTIVITIES = ('Copy', 'Save to Files', 'AirDrop', 'Markup', 'Add to Quick Note')
          ERROR = 'Could not share file'
          
          
          class GateFailure(Exception):
              pass
          
          
          class CommandDeadline(Exception):
              pass
          
          
          def nodes(tree):
              yield tree
              for child in tree.get('children', []):
                  yield from nodes(child)
          
          
          def labels(node):
              attrs = node.get('attributes', {})
              return {attrs.get(key, '') for key in ('accessibilityText', 'text', 'title', 'value')} - {''}
          
          
          def matching(tree, text):
              return [node for node in nodes(tree) if text in labels(node)]
          
          
          def bounds(node):
              value = node.get('attributes', {}).get('bounds', '')
              match = re.fullmatch(r'\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]', value)
              if not match:
                  raise GateFailure('Missing usable accessibility bounds; inspect retained hierarchy/screenshot.')
              x, y, right, bottom = map(int, match.groups())
              if right <= x or bottom <= y:
                  raise GateFailure('Empty accessibility bounds; inspect retained hierarchy/screenshot.')
              return x, y, right, bottom
          
          
          
          def screen_bounds(tree):
              # Maestro iOS wraps application/window nodes in a zero-frame synthetic root.
              frames = set()
              for node in nodes(tree):
                  try:
                      frames.add(bounds(node))
                  except GateFailure:
                      continue
              if not frames:
                  raise GateFailure('No observed nonzero application/window frame.')
              largest = max((right-left)*(bottom-top) for left, top, right, bottom in frames)
              candidates = [frame for frame in frames if (frame[2]-frame[0])*(frame[3]-frame[1]) == largest]
              if len(candidates) != 1:
                  raise GateFailure('Ambiguous observed application/window frames; inspect hierarchy.')
              return candidates[0]
          
          
          def thread_anchor(tree):
              # Keep the actual observed label, including a composite Markdown paragraph.
              candidates = {text for node in nodes(tree) for text in labels(node)
                            if len(text) <= 250 and any(marker in text for marker in
                                ('Make remote coding feel local', 'GitHub repository', 'Reference website'))}
              candidates = [text for text in candidates if len(matching(tree, text)) == 1]
              if not candidates:
                  raise GateFailure('Original thread anchor unavailable; inspect retained hierarchy.')
              return min(candidates, key=lambda text: (len(text), text))
          
          
          def normalized_filename(text):
              return text.strip(' \u00a0')
          
          
          def filename_label(node):
              attrs = node['attributes']
              return next(attrs[key] for key in ('accessibilityText', 'text', 'title', 'value') if attrs.get(key))
          
          
          def filename_target(tree, *, normalize=True):
              # The hosted hierarchy repeats the NBSP-prefixed label on a parent and leaf.
              if normalize:
                  found = [node for node in nodes(tree) if not node.get('children')
                           and {normalized_filename(text) for text in labels(node)} == {FILENAME}]
              else:
                  found = matching(tree, FILENAME)
              if len(found) != 1:
                  raise GateFailure('Need one exact normalized report.pdf leaf, excluding paragraph/container nodes; inspect retained hierarchy.')
              node = found[0]
              x, y, right, bottom = bounds(node)
              sx, sy, sr, sb = screen_bounds(tree)
              # Maestro 2.11 drops XCUI elementType; retain compact, onscreen leaf checks.
              if (node.get('children') or (not normalize and labels(node) != {FILENAME})
                      or node.get('enabled') is False or node.get('attributes', {}).get('enabled') == 'false'
                      or not (sx <= x < right <= sr and sy <= y < bottom <= sb)
                      or right-x > 240 or bottom-y > 64):
                  raise GateFailure('Filename bounds/state are a paragraph/container, disabled or offscreen; no long press attempted. Inspect initial receipts.')
              return node
          
          
          def reject_error(tree):
              if any(ERROR.lower() in text.lower() for node in nodes(tree) for text in labels(node)):
                  raise GateFailure('Native share error visible; inspect retained frame and hierarchy.')
          
          
          def unique_control(tree, text):
              found = matching(tree, text)
              if len(found) != 1:
                  raise GateFailure('Expected a unique native control: ' + text + '; inspect retained hierarchy.')
              x, y, right, bottom = bounds(found[0])
              sx, sy, sr, sb = screen_bounds(tree)
              if found[0].get('enabled') is False or found[0].get('attributes', {}).get('enabled') == 'false' or not (sx <= x < right <= sr and sy <= y < bottom <= sb) or bottom-y > 100:
                  raise GateFailure('Native control has uncertain bounds/state: ' + text + '; inspect retained hierarchy.')
              return found[0]
          
          
          def dismiss_control(tree):
              for text in ('Close', 'Cancel'):
                  if len(matching(tree, text)) == 1:
                      unique_control(tree, text)
                      return text
              raise GateFailure('No unique Close/Cancel control in the observed sheet; inspect sheet receipts and document an observed dismissal gesture before retrying.')
          
          
          def menu_region(tree):
              controls = [unique_control(tree, text) for text in MENU]
              titles = [node for node in nodes(tree) if not node.get('children')
                        and any(text.endswith('/' + FILENAME) for text in labels(node))]
              if len(titles) != 1:
                  raise GateFailure('Need one observed full-path report.pdf menu title; inspect menu receipts.')
              sx, sy, sr, sb = screen_bounds(tree)
              elements = controls + titles
              containers = [node for node in nodes(tree) if node is not tree
                            and all(any(child is element for child in nodes(node)) for element in elements)
                            and sx <= bounds(node)[0] < bounds(node)[2] <= sr
                            and sy <= bounds(node)[1] < bounds(node)[3] <= sb
                            and bounds(node) != (sx, sy, sr, sb)]
              if not containers:
                  raise GateFailure('Title and actions do not share a bounded modal menu; inspect menu receipts.')
              return bounds(containers[-1])
          
          
          def menu_backdrop(tree, original_filename_bounds):
              menu_rect = menu_region(tree)
              sx, sy, sr, sb = screen_bounds(tree)
              # UIKit's modal hierarchy hides the underlying filename leaf. Preserve its
              # pre-gesture rectangle and also avoid the observed native Preview region.
              blocked = [menu_rect, original_filename_bounds]
              blocked += [bounds(node) for node in matching(tree, 'Preview')]
              blocked += [bounds(node) for node in nodes(tree) if node.get('clickable') is True]
              for x, y in ((sx+12, sy+80), (sr-12, sy+80), (sx+12, sb-80), (sr-12, sb-80)):
                  if not (sx < x < sr and sy < y < sb):
                      continue
                  if not any(left <= x <= right and top <= y <= bottom for left, top, right, bottom in blocked):
                      return f'{x},{y}'
              raise GateFailure('No hierarchy-observed background point outside the native menu; inspect menu receipts.')
          
          
          def selector(text):
              return json.dumps(re.escape(text))
          
          
          def visible(text):
              return '- assertVisible: ' + selector(text) + '\n'
          
          
          def absent(text):
              return '- assertNotVisible: ' + json.dumps('.*' + re.escape(text) + '.*') + '\n'
          
          
          def redact_diagnostics(path):
              for file in path.rglob('*'):
                  if file.is_file() and file.suffix in ('.json', '.log', '.txt', '.xml', '.html'):
                      text = file.read_text(errors='replace')
                      text = re.sub(r'(?i)\b[a-z][a-z0-9+.-]*://[^\s"<>]+', '[redacted-url]', text)
                      text = re.sub(r'(?im)^.*(?:native.?argv|launch.?arguments|authorization|access.?token|refresh.?token).*$','[redacted-sensitive-line]', text)
                      text = re.sub(r'(?i)("(?:token|secret|apiKey|argv)"\s*:\s*)"[^"\n]*"', r'\1"[redacted]"', text)
                      file.write_text(text)
          
          
          class Interaction:
              def __init__(self, udid, phase, diagnostic_dylib_sha256):
                  self.udid, self.phase = udid, phase
                  self.diagnostic_dylib_sha256 = diagnostic_dylib_sha256
                  self.observer_cleanup_verified = True
                  self.started = time.monotonic()
                  self.prefix = 'filechip-' + phase + '-' + str(time.time_ns())
                  self.path = Path(os.environ['GITHUB_WORKSPACE']) / 'artifacts/ios-validation' / self.prefix
                  self.path.mkdir(parents=True, mode=0o700)
                  self.maestro = Path(os.environ['RUNNER_TEMP']) / 'maestro/bin/maestro'
                  self.groups, self.cleaned, self.processes = {}, set(), {}
                  self.recorder = None
                  self.result = {'phase': phase, 'passed': False, 'accepted': False,
                                 'diagnostic_scope': 'app-owned passive filechip observer',
                                 'visual_review_required': True, 'limits_seconds': {
                                     'total': TOTAL_SECONDS, 'work': WORK_SECONDS, 'outer': OUTER_SECONDS,
                                     'observer_wait': OBSERVER_SECONDS, 'observer_stop_including_reap': CLEANUP_SECONDS,
                                     'action': ACTION_SECONDS, 'maestro_command': MAESTRO_SECONDS,
                                     'cleanup_including_reap': CLEANUP_SECONDS, 'term_grace': TERM_GRACE_SECONDS,
                                     'recorder_finalization': RECORDER_SECONDS, 'diagnostics': DIAGNOSTICS_SECONDS,
                                     'visibility': VISIBILITY_MS / 1000},
                                 'stages': [], 'cleanup': [], 'assertions_complete': False}
                  self.checkpoint()
          
              def checkpoint(self):
                  temporary = self.path / 'receipt.tmp'
                  temporary.write_text(json.dumps(self.result, indent=2) + '\n')
                  temporary.replace(self.path / 'receipt.json')
          
              @contextmanager
              def limit(self, seconds, work=False):
                  remaining = (WORK_SECONDS if work else TOTAL_SECONDS) - (time.monotonic()-self.started)
                  if remaining <= 0:
                      raise CommandDeadline()
                  signal.setitimer(signal.ITIMER_REAL, min(seconds, remaining))
                  try:
                      yield min(seconds, remaining)
                  finally:
                      remaining = TOTAL_SECONDS - (time.monotonic()-self.started)
                      signal.setitimer(signal.ITIMER_REAL, max(0, remaining))
          
              def start(self, command, stage, stdout, stderr):
                  purpose = self.prefix + '-' + stage
                  try:
                      process = owned.spawn(command, purpose=purpose, stdin=subprocess.DEVNULL,
                                            stdout=stdout, stderr=stderr, cwd=self.path)
                      self.processes[process.pid] = process
                      return process
                  finally:
                      # Includes a launcher registered before spawn raised; never sweep the job registry.
                      self.groups.update({row['pid']: row for row in owned.records() if row['purpose'].startswith(self.prefix + '-')})
          
              def stop(self, record):
                  if record['pid'] in self.cleaned:
                      return
                  receipt = {'purpose': record['purpose'].removeprefix(self.prefix + '-'), 'stopped': False}
                  self.result['cleanup'].append(receipt)
                  began = time.monotonic()
                  try:
                      with self.limit(CLEANUP_SECONDS) as timeout:
                          deadline = time.monotonic() + timeout
                          if not owned.terminate(record, grace=TERM_GRACE_SECONDS):
                              raise GateFailure('Owned process identity not confirmed.')
                          while owned.group_running(record['pid']):
                              remaining = deadline - time.monotonic()
                              if remaining <= 0:
                                  raise CommandDeadline()
                              time.sleep(min(0.05, remaining))
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              raise CommandDeadline()
                          process = self.processes.get(record['pid'])
                          if process is not None:
                              process.wait(timeout=remaining)
                              if time.monotonic() >= deadline:
                                  raise CommandDeadline()
                              receipt['reaped'] = True
                          receipt['stopped'] = True
                          self.cleaned.add(record['pid'])
                  except Exception as error:
                      receipt['stopped'] = False
                      self.cleaned.discard(record['pid'])
                      receipt['error_type'] = type(error).__name__
                  finally:
                      receipt['elapsed_seconds'] = round(time.monotonic()-began, 3)
          
              def command(self, stage, command, output=None):
                  if (not self.observer_cleanup_verified or any(row['pid'] not in self.cleaned for row in self.groups.values()
                          if row['purpose'] != self.prefix + '-recording')
                          or any(not row['stopped'] for row in self.result['cleanup'])):
                      raise GateFailure('Owned action group did not stop; refusing another device command.')
                  receipt = {'stage': stage, 'exit_code': None, 'timed_out': False}
                  self.result['stages'].append(receipt)
                  process = None
                  began = time.monotonic()
                  with (self.path / (stage + '.log')).open('wb') as log:
                      with (self.path / output).open('wb') if output else open(os.devnull, 'wb') as out:
                          try:
                              with self.limit(MAESTRO_SECONDS if command[0] == str(self.maestro) else ACTION_SECONDS, work=True) as timeout:
                                  deadline = time.monotonic() + timeout
                                  process = self.start(command, stage, out if output else log, log if output else subprocess.STDOUT)
                                  receipt['exit_code'] = process.wait(timeout=max(0, deadline-time.monotonic()))
                          except (CommandDeadline, subprocess.TimeoutExpired):
                              receipt['timed_out'] = True
                              raise GateFailure('Deadline at ' + stage + '; inspect retained diagnostics.') from None
                          except Exception as error:
                              receipt['error_type'] = type(error).__name__
                              raise
                          finally:
                              receipt['elapsed_seconds'] = round(time.monotonic()-began, 3)
                              try:
                                  if process:
                                      self.stop(self.groups[process.pid])
                              finally:
                                  self.checkpoint()
