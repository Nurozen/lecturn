name: Mobile Showcase Screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-ios-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - VARIANT: before
            SOURCE_COMMIT: 27ceac9214b306508070161df61f85291fbcdfca
            SOURCE_TREE: 0c7212f49f0a9ac908928a496f5158b434c78682
            BUILD_RUN_ID: '38680507825'
            BUILD_COMMIT: 'ac51e13f2c0e287fd58261b2c82ffcbea2e98bfa'
            BUILD_ARCHIVE_HASH: 'd229d903f7fda534640d532bf736e8502c12cd5410b69969b2db972eb011fc09'
            BUILD_ARTIFACT: ios-before-native-build
          - VARIANT: after
            SOURCE_COMMIT: '65318f080902a00d1b421ff86755f1a4a75e8b5b'
            SOURCE_TREE: 7874152fdc79ba9ab7112a7bc3717b9d81815c56
            BUILD_RUN_ID: '38680507825'
            BUILD_COMMIT: 'ac51e13f2c0e287fd58261b2c82ffcbea2e98bfa'
            BUILD_ARCHIVE_HASH: 'a52ff786672cddeddd8731b89952300bcbfc06ded4e8712df421973005b83349'
            BUILD_ARTIFACT: ios-after-native-build
    env:
      VARIANT: ${{ matrix.VARIANT }}
      SOURCE_COMMIT: ${{ matrix.SOURCE_COMMIT }}
      SOURCE_TREE: ${{ matrix.SOURCE_TREE }}
      BUILD_RUN_ID: ${{ matrix.BUILD_RUN_ID }}
      BUILD_COMMIT: ${{ matrix.BUILD_COMMIT }}
      BUILD_ARCHIVE_HASH: ${{ matrix.BUILD_ARCHIVE_HASH }}
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Materialize immutable exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/Nurozen/lecturn.git
          git config core.sparseCheckout true
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c protocol.file.allow=never -c submodule.recurse=false fetch --no-tags --depth=1 --filter=blob:none origin "$SOURCE_COMMIT"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test ! -e .env
          test ! -e .env.local
          test ! -e apps/mobile/.env
          test ! -e apps/mobile/.env.local
      - name: Materialize hash-pinned reviewed helper outside source inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYHELPER'
          import os,json,hashlib,base64
          from pathlib import Path
          payload=base64.b64decode('')
          assert hashlib.sha256(payload).hexdigest() == '4ee49e9ee2d28454184dd267820ac0f2e5584f7dc4aa3bd170db1c493ecc4d6c'
          files=json.loads(payload)
          assert set(files) == set(['drive.py', 'geometry.py', 'fixture-probe.mjs', 'fixtures.mjs', 'gateway.mjs', 'ios-url-probe.swift', 'ios_owned_processes.py', 'metro-runtime-memo.mjs', 'motion-summary.mjs', 'provenance.py', 'run.py', 'safety.cjs', 'verify-list.mjs'])
          root=Path(os.environ['RUNNER_TEMP'])/'capture'
          assert not root.exists()
          root.mkdir(mode=0o700)
          hashes={}
          for name,encoded in files.items():
              assert Path(name).name==name
              data=base64.b64decode(encoded)
              (root/name).write_bytes(data)
              hashes[name]=hashlib.sha256(data).hexdigest()
          output=Path(os.environ['RUNNER_TEMP'])/'capture-output'
          output.mkdir()
          (output/'capture-helper-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PYHELPER
          echo "CAPTURE_SOURCE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CAPTURE_OUTPUT=$RUNNER_TEMP/capture-output" >> "$GITHUB_ENV"
          echo "CAPTURE_STATE=$RUNNER_TEMP/capture-state" >> "$GITHUB_ENV"
          echo "BUILD_ARCHIVE=$RUNNER_TEMP/build-input/Lecturn-$VARIANT-simulator.app.tgz" >> "$GITHUB_ENV"
      - name: Setup source-pinned dependencies
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...
      - name: Expose pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"
      - name: Download fresh matching native build
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: Nurozen/lecturn
          run-id: ${{ matrix.BUILD_RUN_ID }}
          name: ${{ matrix.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/build-input
      - name: Verify source, build run, archive, binary and installed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/capture/provenance.py"
      - name: Install pinned task-local native driver
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip' -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/maestro/bin/maestro" --version
      - name: Compile Foundation transport probe for installed runtime
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -parse-as-library -sdk "$sdk" -target arm64-apple-ios26.0-simulator "$RUNNER_TEMP/capture/ios-url-probe.swift" -o "$RUNNER_TEMP/capture/ios-url-probe"
      - name: Capture normal app in four identical synthetic scenarios
        timeout-minutes: 54
        run: python3 "$RUNNER_TEMP/capture/run.py"
      - name: Stop only registered remaining owned process groups
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ios-owned-process-groups.jsonl" ]; then
            python3 -c 'import os,sys; sys.path.insert(0,os.environ["RUNNER_TEMP"]+"/capture"); import ios_owned_processes as p; p.cleanup()'
          fi
      - name: Upload curated evidence and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-motion-${{ matrix.VARIANT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-output/
          if-no-files-found: error
          retention-days: 14
