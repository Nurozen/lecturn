                  descriptor = os.open(path, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW)
                  digest, size = hashlib.sha256(), 0
                  with os.fdopen(descriptor, 'rb') as stream:
                      meta = os.fstat(stream.fileno())
                      if not stat.S_ISREG(meta.st_mode) or meta.st_size > MAX_IMAGE_BYTES:
                          raise CaptureError('image_type_or_size')
                      while True:
                          if time.monotonic() >= deadline:
                              raise CaptureError('image_hash_deadline')
                          chunk = stream.read(1024 * 1024)
                          if not chunk:
                              break
                          size += len(chunk)
                          if size > MAX_IMAGE_BYTES:
                              raise CaptureError('image_size')
                          digest.update(chunk)
                  return digest.hexdigest()
          
              def discover(self, udid, expected):
                  devices = json.loads(self.read(['xcrun', 'simctl', 'list', 'devices', '--json'], 'devices'))
                  matches = [d for group in devices['devices'].values() for d in group if d['udid'].upper() == udid]
                  if len(matches) != 1 or matches[0]['state'] != 'Booted':
                      raise CaptureError('exact_simulator_not_booted')
