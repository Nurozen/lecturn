name: Mobile Showcase Screenshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Device platforms to capture
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      appearance:
        description: System appearances to capture
        required: true
        default: both
        type: choice
        options:
          - both
          - dark
          - light
      theme:
        description: Palette to capture (all multiplies the run by six)
        required: true
        default: lecturn
        type: choice
        options:
          - lecturn
          - lecturn-chat
          - grove
          - ocean
          - ember
          - iris
          - all

permissions:
  contents: read
  actions: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  ios:
    name: iPhone 6.9, iPhone 6.5, and iPad 13
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-26
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 60 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Download exact reusable simulator app
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: Nurozen/lecturn
          run-id: 38302183128
          name: ios-link-validation-diagnostics
          path: artifacts/ios-reuse-input

      - name: Verify and install reusable app artifact
        run: |
          echo '752c2b09e418dcfc6b439e441529c2415b8f1dcc780acd5da4a5a81579ec9d38  artifacts/ios-reuse-input/Lecturn-simulator.app.tgz' | shasum -a 256 -c -
          test "$(cat artifacts/ios-reuse-input/validation-commit.txt)" = '3ed03a2f87fd7e5736b209a47c74b0c263609716'
          mkdir -p apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          tar -xzf artifacts/ios-reuse-input/Lecturn-simulator.app.tgz -C apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator/Lecturn.app/Info.plist

      - name: Install pinned local native UI driver
        run: |
          curl --fail --location --silent --show-error 'https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip' -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/maestro/bin/maestro" --version

      - name: Capture native startup diagnostics
        timeout-minutes: 20
        env:
          EXPO_PUBLIC_SHOWCASE: '1'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          git rev-parse HEAD
          cat > "$RUNNER_TEMP/lecturn-link-fixture.mjs" <<'FIXTURE'
          import { registerHooks } from "node:module";
          import assert from "node:assert/strict";
          registerHooks({
            load(url, context, nextLoad) {
              const result = nextLoad(url, context);
              if (!url.endsWith("/scripts/mobile-showcase.ts")) return result;
              let source = typeof result.source === "string" ? result.source : Buffer.from(result.source).toString("utf8");
              const replaceOnce = (before, after) => {
                assert.equal(source.split(before).length - 1, 1, "Pinned showcase harness anchor changed");
                source = source.replace(before, after);
              };
              replaceOnce("await waitForIosShowcaseScene(simulator.udid, scene, 120_000);", "await waitForIosShowcaseScene(simulator.udid, scene, 300_000);");
              replaceOnce("const readyScene = await NodeFSP.readFile(readyPath, \"utf8\").catch(() => \"\");\n    if (readyScene.trim() === scene) return;", "const readyScene = await NodeFSP.readFile(readyPath, \"utf8\").catch(() => \"\");\n    if (readyScene.trim() === scene) { console.log('iOS readiness marker verified:', scene); return; }");
              replaceOnce("  throw new Error(`iOS showcase scene '${scene}' did not render within ${timeoutMs}ms.`);", `  const diagnosticDirectory = NodePath.join(REPO_ROOT, "artifacts/ios-validation");
            await NodeFSP.mkdir(diagnosticDirectory, { recursive: true });
            await runCommand("xcrun", ["simctl", "io", udid, "screenshot", NodePath.join(diagnosticDirectory, "readiness-timeout-" + Date.now() + ".png")]).catch(() => undefined);
            console.log("iOS readiness timeout; diagnostic screenshot retained; no acceptance.");
            throw new Error(\`iOS showcase scene '\${scene}' did not render within \${timeoutMs}ms.\`);`);
              replaceOnce("    for (const capture of captures) {\n      const pairingHost", `    if (hasIos && !options.skipMetro) {
                console.log("Validation harness: native build complete; rewarming iOS bundle after prebuild.");
                await warmMetroBundle("ios", metroHost, showcaseConfig);
