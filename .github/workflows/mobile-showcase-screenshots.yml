          files=json.loads(payload)
          assert set(files) == set(['drive.py', 'fixture-probe.mjs', 'fixtures.mjs', 'gateway.mjs', 'geometry.py', 'ios-url-probe.swift', 'ios_owned_processes.py', 'metro-entry-hook.mjs', 'metro-runtime-memo.mjs', 'motion-summary.mjs', 'provenance.py', 'retrieve-trace.mjs', 'run.py', 'safety.cjs', 'trace-runtime.js', 'transform.cjs', 'verify-list.mjs'])
