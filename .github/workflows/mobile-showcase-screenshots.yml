name: Mobile Showcase Screenshots
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ios]
        default: ios
      appearance:
        type: choice
        options: [light]
        default: light
      theme:
        type: choice
        options: [lecturn]
        default: lecturn
permissions:
  contents: read
  actions: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  ios:
    name: Build pinned diagnostic simulator app only
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - name: Checkout pinned product plus explicit native diagnostic
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@lecturn/mobile...
              - --filter=@lecturn/scripts...
              - --filter=lecturn...
      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version
      - name: Build exact diagnostic native app
        timeout-minutes: 50
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EXPO_NO_GIT_STATUS: '1'
          LECTURN_SHOWCASE_CAPTURE_BUILD: '1'
          EXPO_PUBLIC_SHOWCASE: '1'
          NODE_ENV: development
        run: |
          pnpm exec expo prebuild --clean --platform ios
          xcodebuild -workspace ios/Lecturn.xcworkspace -scheme Lecturn -configuration Debug -sdk iphonesimulator -derivedDataPath .showcase/ios-derived-data -quiet ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Retain diagnostic app and provenance
        if: always()
        run: |
          mkdir -p artifacts/ios-diagnostic-build
          git rev-parse HEAD > artifacts/ios-diagnostic-build/validation-commit.txt
          git rev-parse HEAD^{tree} > artifacts/ios-diagnostic-build/validation-tree.txt
          git status --porcelain > artifacts/ios-diagnostic-build/post-build-status.txt
          cp apps/mobile/modules/lecturn-markdown-text/ios/LecturnMarkdownText.mm artifacts/ios-diagnostic-build/LecturnMarkdownText.diagnostic.mm
          shasum -a 256 artifacts/ios-diagnostic-build/LecturnMarkdownText.diagnostic.mm > artifacts/ios-diagnostic-build/native-source.sha256
          ios_products=apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator
          if [ -d "$ios_products/Lecturn.app" ]; then
            cp "$ios_products/Lecturn.app/EXUpdates.bundle/fingerprint" artifacts/ios-diagnostic-build/native-runtime.txt
            tar -czf artifacts/ios-diagnostic-build/Lecturn-diagnostic-simulator.app.tgz -C "$ios_products" Lecturn.app
            shasum -a 256 artifacts/ios-diagnostic-build/Lecturn-diagnostic-simulator.app.tgz > artifacts/ios-diagnostic-build/app-archive.sha256
          fi
      - name: Upload diagnostic native build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-diagnostic-native-build
          path: artifacts/ios-diagnostic-build/
          if-no-files-found: error
          retention-days: 14
