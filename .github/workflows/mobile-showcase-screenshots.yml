          files=json.loads(payload)
          assert set(files) == set(['disclosure_navigation.py', 'disclosure_targets.py', 'drive.py', 'fixture-probe.mjs', 'fixtures.mjs', 'gateway.mjs', 'geometry.py', 'hierarchy_observation.py', 'ios-url-probe.swift', 'ios_owned_processes.py', 'metro-entry-hook.mjs', 'metro-runtime-memo.mjs', 'motion-summary.mjs', 'provenance.py', 'retrieve-trace.mjs', 'run.py', 'safety.cjs', 'startup-schema.cjs', 'startup_failure.py', 'startup_stage.py', 'trace-runtime.js', 'transform.cjs', 'verify-list.mjs'])
