                              if confined(after['containers']['data'], STATUS_FILE) != candidate[0]:
                                  raise CaptureError('journal_identity_unverified')
                              verified = time.time() * 1000
                          except CaptureError as error:
                              if str(error) in ('deadline', 'interrupted'):
                                  raise
                              journal['error'] = 'journal_identity_unverified'
                          except Exception:
                              journal['error'] = 'journal_identity_unverified'
                          else:
                              journal.pop('error', None)
                              journal['valid'] = True
                              journal['status'] = candidate[1]
                              journal['read']['identity_verified_after_read'] = True
                              journal['read']['verified_unix_ms'] = verified
                      if primary_error is None:
                          if confined(after['containers']['data'], FILE) != native_path:
                              raise CaptureError('identity_changed_after_read')
                          receipt['read']['identity_verified_after_read'] = True
                          receipt['read']['verified_unix_ms'] = time.time() * 1000
                          receipt['dump_complete'] = True
